// Instala o app no simulador e executa o app
tasks.register('runSimulatorAndroid', Exec){
    group = 'androidActions'
    description = 'Executa o simulador Android e instala o programa'
    mustRunAfter tasks.named('installDebug')
    outputs.upToDateWhen { false }

    doFirst { 
        String pacote = appIdProv.get() + '.'
        String app = projNomeProv.get().toLowerCase()
        commandLine 'adb', 'shell', 'am', 'start', '-n', "${pacote}${app}/${pacote}app.MainActivity"
    }
}
// Inicia o primeiro emulador android encontrado
tasks.register('runAndroid', Exec) {
    group = 'androidActions'
    description = 'Executa o simulador Android e roda o programa'
    finalizedBy tasks.named('installDebug')
    finalizedBy tasks.named('runSimulatorAndroid')
    inputs.files(tasks.named('buildAndroid'))
    outputs.upToDateWhen { false } // sempre executa

    doFirst {
        String simulador = simuladorProv.get()
        if (!simulador) {
            throw new GradleException('Nenhum simulador android disponível para execução')
        }
        String parametros = [
            'emulator', '-avd', simulador, '-gpu', 'host', '-grpc', 'skip', '-grpc-use-jwt', 
            '-no-boot-anim', '-no-metrics'
        ].join(' ')
        List<String> saidaFiltro = [
            'Ignoring message',
            'ignored',
            'adb.exe: device offline',
            'requires a signed jwt token',
            'QMetaObject::connectSlotsByName: No matching signal',
            'CPUID.01H:ECX.xsave',
            'CPUID.01H:ECX.avx'
        ]
        // Detecção básica de SO para rodar o comando "start" (Windows) ou "&" (Linux/Mac)
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            String filtro = 'findstr /V ' + saidaFiltro.collect { 
                "/C:\"${it}\""
                // "/${winDiscProv.get()}:\"${it}\"" 
            }.join(' ')
            new ProcessBuilder(
                'cmd', '/c', "start cmd /k \"${parametros} 2>&1 | ${filtro}\""
            ).start()
        } else {[
            'sh', '-c', "${parametros} 2>&1 | grep -vE '${saidaFiltro.join('|')}' &"
        ].execute() }
        
        commandLine 'adb', 'wait-for-device' // aguarda o simulador ficar pronto

        boolean bootCompleted = false
        int attempts = 0
        ByteArrayOutputStream stdout
        ByteArrayOutputStream stderr
        while (!bootCompleted && attempts < 150) { // tenta por 150 segundos
            try {
                stdout = new ByteArrayOutputStream()
                stderr = new ByteArrayOutputStream()
                Process processo = ['adb', 'shell', 'getprop', 'sys.boot_completed'].execute()
                processo.waitForProcessOutput(stdout, stderr) // pega saída e erro e espera terminar

                if (stdout.toString().trim() == '1') {
                    bootCompleted = true
                } else { 
                    sleep(1000) // espera 1 segundo 
                }
            } catch (Exception e) { 
                sleep(1000) 
            }
            attempts++
        }
    }
}
