// Declaração de plugins
// plugins {}
// Atalhos para facilitar a leitura
Object propsLocal = gradle.ext.propsLocal
// Provedores para acesso lazy às variáveis
Provider<Boolean> eWindowsProv = providers.systemProperty('os.name').map { os ->
    os.toLowerCase().contains('windows')
}
Provider<Directory> buildDir = layout.buildDirectory
Provider<Directory> deployDirProv = buildDir.dir('distributions')
Provider<String> nomeAppProv = providers.gradleProperty('projNome')
Provider<String> espNomeProv = providers.gradleProperty('espolioDir').orElse('espolio')
Provider<String> verNumProv = providers.gradleProperty('appVerNum')
Provider<String> srvDonoProv = project.providers.provider { propsLocal.getProperty('srv.dono') }
Provider<String> srvSedeProv = project.providers.provider { propsLocal.getProperty('srv.sede') }
Provider<String> srvDirProv = project.providers.provider { propsLocal.getProperty('srv.dir') }
Provider<String> winDiscProv = project.providers.provider {
    propsLocal.getProperty('unidade.win', 'C')
}
Provider<RegularFile> jarFinal = buildDir.file(
    nomeAppProv.flatMap { nome -> verNumProv.map { ver -> "distributions/${nome}-${ver}.jar" } }
)
Provider<Boolean> jarMagroProv = project.providers.gradleProperty('thin').orElse(false) // -Pthin=true
// Tarefas personalizadas
tasks.named('jar') { enabled = false } // destivado para não gerar jar parciais
// Configurado para alterar o nome do jar gerado e otimizar o tamanho do arquivo
tasks.named('bootJar') { // Compilador padrão
    onlyIf{ !jarMagroProv.get() }

    mustRunAfter tasks.named('minWebJar')
    inputs.files(tasks.named('minWebJar'))

    archiveBaseName.set(nomeAppProv)
    archiveVersion.set(verNumProv)
    archiveClassifier.set('')
    destinationDirectory.set(deployDirProv)
    // Injeta as classes otimizadas pelo ProGuard
    from({ zipTree(buildDir.file('intermediates/minified-project.jar' )) }) {
        into 'BOOT-INF/classes'
    }
    // Filtra o classpath, mantem todas os .jar, remove pastas locais que o ProGuard processou
    classpath = classpath.filter { file ->
        file.isFile() && 
        file.name.endsWith('.jar') &&
        !file.name.contains('spring-boot-jarmode-tools') &&
        !file.name.contains('bib-lista') // remove o JAR duplicado
    }
    
    exclude 'main/**', '**/classpath.idx', '**/layers.idx', '**/spring-boot-jarmode-tools-*.jar'
    exclude 'BOOT-INF/classpath.idx', 'BOOT-INF/layers.idx'
    entryCompression = ZipEntryCompression.DEFLATED
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// Configurado para alterar o nome do jar gerado e otimizar o tamanho dos arquivos
tasks.register('orderJar', Jar) { // Compilador secundário -Pthin=true
    group = 'WebActions'
    description = 'Gera o JAR magro e copia as dependências para a pasta lib/'
    onlyIf{ jarMagroProv.get() }

    mustRunAfter tasks.named('minWebJar')
    inputs.files(tasks.named('minWebJar'))
    finalizedBy tasks.named('orderLibs')
    
    archiveBaseName.set(nomeAppProv)
    archiveVersion.set(verNumProv)
    archiveClassifier.set('')
    destinationDirectory.set(deployDirProv)
    // Puxa apenas o zip do ProGuard
    from({ zipTree(buildDir.file('intermediates/minified-project.jar')) })
    
    manifest {
        attributes(
            'Main-Class': 'com.oboco.web.LoggerApplication',
            'Class-Path': project.providers.provider {
                configurations.runtimeClasspath.files
                    .findAll { !it.name.startsWith('bib-lista') }
                    .collect { "lib/$it.name" }.join(' ')
            }
        )
    }
}
// Cria cópia das Libs separadamente
tasks.register('orderLibs', Copy) {
    group = 'WebActions'
    description = 'Copia as dependências para a pasta lib/'
    onlyIf{ jarMagroProv.get() }

    mustRunAfter tasks.named('orderJar') // obriga o JAR ser gerado primeiro
    
    into deployDirProv.map { dir -> dir.dir('lib') }
    from configurations.runtimeClasspath
    exclude 'spring-boot-jarmode-tools-*.jar'
}
// Apaga a pasta do inteira de build
tasks.register('cleanWeb') {
    group = 'WebActions'
    description = 'Limpa o ambiente java web, para testes completos'
    outputs.upToDateWhen { false }
    finalizedBy tasks.named('clean')
}
// Minifica os jar gerados
tasks.register('minWebJar', proguard.gradle.ProGuardTask) {
    mustRunAfter tasks.named('classes')
    inputs.files(tasks.named('classes'))
    injars sourceSets.main.output, filter: '!main/' // pega as saídas compiladas
    // .jar temporário apenas com classes magras
    Provider<RegularFile> miniJarProv = buildDir.file('intermediates/minified-project.jar')
    outjars miniJarProv
    libraryjars "${System.getProperty('java.home')}/jmods"
    // Referencia as libs externas mas não inclui no processo de encolhimento
    libraryjars configurations.runtimeClasspath
    configuration file('proguard-web.pro')

    doFirst {
        File miniJar = miniJarProv.get().asFile
        if (miniJar.exists()) miniJar.delete()
        miniJar.parentFile.mkdirs()
    }
}
// Compilação do aplicativo
tasks.register('buildWeb') {
    group = 'WebActions'
    mustRunAfter(jarMagroProv.map { eThin -> 
        eThin ? tasks.named('orderJar') : tasks.named('bootJar') 
    })
    inputs.files(jarMagroProv.map { eThin -> 
        eThin ? tasks.named('orderJar') : tasks.named('bootJar') 
    })
    outputs.file jarFinal
}
// Roda em terminal externo
tasks.register('runWeb') {
    group = 'WebActions'
    description = 'Executa se o JAR já existente na pasta lib'
    mustRunAfter assemble // só tenta rodar se o arquivo realmente existir
    inputs.files(tasks.named('buildWeb'))
    outputs.upToDateWhen { false }

    doFirst {
        File deployDir = deployDirProv.get().asFile
        File jarArq = deployDir.listFiles()?.find { it.isFile() && it.name.endsWith('.jar') }
        
        if (jarArq == null || !jarArq.exists()) {
             throw new GradleException("JAR magro não encontrado em ${deployDir.absolutePath}")
        }

        ProcessBuilder pb
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            pb = new ProcessBuilder('cmd', '/c', 'start', 'cmd', '/k', 'java', '-jar', jarArq.name)
        } else { pb = new ProcessBuilder('sh', '-c', 'java', '-jar', jarArq.name, '&') }

        pb.directory(deployDir)
        pb.start()
    }
}
// Realiza todos os testes
tasks.register('testWeb') {
    group = 'WebActions'
    description = 'Realiza os testes para o aplicativo web'
    finalizedBy tasks.named('check')
    finalizedBy tasks.named('test')
}
// Garante a saída dos resultados dos testes
tasks.withType(Test).configureEach {
    outputs.upToDateWhen { false }

    useJUnitPlatform() // liga o motor de testes do JUnit Platform

    jvmArgs('-Xshare:off') // desliga o Class Data Sharing para evitar o warning da JVM 
    jvmArgs('-XX:+EnableDynamicAgentLoading') // permite o Mockito a injetar o agente de testes

    systemProperty 'spring.main.banner-mode', 'off' // desliga o Logo ASCII gigante do Spring
    systemProperty 'logging.level.root', 'WARN' // esconde os INFOs de inicio

    testLogging {
        events 'passed', 'skipped', 'failed' // mostra no terminal os testes
        showStandardStreams = false // saída padrão do console
        // Se der erro, mostra a origem do problema
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }

    addTestListener(new org.gradle.api.tasks.testing.TestListener() {
        void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {}
        void beforeTest(org.gradle.api.tasks.testing.TestDescriptor test) {}
        void afterTest(
            org.gradle.api.tasks.testing.TestDescriptor test, 
            org.gradle.api.tasks.testing.TestResult result
        ) {}
        void afterSuite(
            org.gradle.api.tasks.testing.TestDescriptor desc, 
            org.gradle.api.tasks.testing.TestResult result) {
            // Garante que é a execução raiz de todos os testes
            if (!desc.parent) { 
                String total = """\
                    || Total de testes: ${result.testCount} |
                    | sucessos: ${result.successfulTestCount} |
                    | falhas: ${result.failedTestCount} |
                    | pulados: ${result.skippedTestCount} ||"""
                println '\n======================================================================='
                println "RESULTADO DOS TESTES: ${result.resultType}"
                println total.stripIndent().replaceAll('\n', '')
                println '======================================================================='
            }
        }
    })
}
// Cria um ícone para a página web
tasks.register('webIco') {
    group = 'Web Actions'
    description = 'Gera o icone.png para a aplicação Web'

    Provider<RegularFile> svgFundoProv = espNomeProv.map { espDir ->
        project.rootProject.layout.projectDirectory.file("${espDir}/icones/appBackground.svg")
    }
    Provider<RegularFile> svgFrenteProv = espNomeProv.map { espDir ->
        project.rootProject.layout.projectDirectory.file("${espDir}/icones/appForeground.svg")
    }
    Provider<RegularFile> pngArqProv = buildDir.file('generated/webIcoRes/static/favicon.png')
    
    inputs.files(svgFundoProv, svgFrenteProv)
    outputs.file pngArqProv
    
    doLast {
        File svgFundo = svgFundoProv.get().asFile
        File svgFrente = svgFrenteProv.get().asFile
        File pngArq = pngArqProv.get().asFile
        if (!svgFundo.exists()) throw new GradleException('Faltou o SVG de Fundo!')
        if (!svgFrente.exists()) throw new GradleException('Faltou o SVG de Frente!')
        
        File pastaBuild = pngArq.parentFile
        if (!pastaBuild.exists()) pastaBuild.mkdirs()
        
        List<String> mesclaSVG = [
            eWindowsProv.get() ? "${winDiscProv.get()}:/msys64/ucrt64/bin/magick.exe" : 'magick',
            '-background', 'none',
            svgFundo.absolutePath, 
            svgFrente.absolutePath, 
            '-gravity', 'center', 
            '-composite', 
            '-resize', '2048x2048', 
            pngArq.absolutePath 
        ]
        
        Process processo = mesclaSVG.execute()
        processo.waitForProcessOutput(System.out, System.err)
        if (processo.exitValue() != 0) {
            throw new GradleException('Falha ao gerar o ícone da Web')
        }
    }
}
// Evia a nova versão para o servidor
tasks.register('submitWeb') {
    group = 'deploy actions'
    description = 'Envia os arquivos para o servidor remoto'
    inputs.files(tasks.named('orderJar')) // usa os jar magros para ser mais rápido
    inputs.files(tasks.named('orderLibs'))

    doLast {
        String dono = srvDonoProv.get()
        String sede = srvSedeProv.get()
        String dir = srvDirProv.get()

        if (!dono || !sede || !dir) {
            throw new GradleException('Faltam variáveis do servidor no local.properties!')
        }

        File dirBaseLocal = deployDirProv.get().asFile
        if (!dirBaseLocal.exists()) {
            throw new GradleException("A pasta base de compilação (${dirBaseLocal}) não existe!")
        }

        String comandoFind = "cd ${dir} 2>/dev/null && find . -type f -exec md5sum {} + || true"
        Map<String, String> hashes = [:]
        ByteArrayOutputStream saida = new ByteArrayOutputStream()
        ByteArrayOutputStream erro = new ByteArrayOutputStream()
        
        Process procHash = [
            'ssh', '-o', 'StrictHostKeyChecking=no', "${dono}@${sede}", comandoFind
        ].execute()
        procHash.waitForProcessOutput(saida, erro)
        
        if (procHash.exitValue() != 0) {
            throw new GradleException('' +
                'Falha de conexão com o servidor ao ler os Hashes! \n' +
                "Detalhes: ${erro.toString().trim()}"
            )
        }

        saida.toString().eachLine { linha ->
            linha = linha.trim()
            if (linha && linha.contains('  ')) {
                def partes = linha.split('  ')
                if (partes.size() >= 2) {
                    String hash = partes[0].trim()
                    // Remove o './' que o comando 'find' do Linux coloca no começo do caminho
                    String caminhoRelativo = partes[1].trim().replaceFirst("^\\./", "")
                    hashes[caminhoRelativo] = hash
                }
            }
        }

        String erroHash = erro.toString().trim()
        if (erroHash && !erroHash.contains('Warning')) {
            println ">> ERRO: Aviso SSH (Hash): ${erroHash}"
        }
        // Compara os arquivos
        List<Map> arqsUpload = []
        List<String> caminhosLocais = []
        dirBaseLocal.eachFileRecurse(groovy.io.FileType.FILES) { arquivo ->
            // Pega o caminho relativo do arquivo em relação à 'lib' e converte pra padrão Linux '/'
            String caminhoRel = dirBaseLocal.toPath().relativize(arquivo.toPath()).toString()
            caminhoRel = caminhoRel.replace(File.separator, '/')
            if (!caminhoRel.contains('/')) { caminhoRel = "${nomeAppProv.get()}.jar" } // sem versão
            // Calcula o Hash MD5 local
            caminhosLocais << caminhoRel
            java.security.MessageDigest md = java.security.MessageDigest.getInstance('MD5')
            arquivo.eachByte(8192) { buffer, len -> md.update(buffer, 0, len) }
            String hashLocal = md.digest().encodeHex().toString()
            // Se o hash remoto for diferente do local ou o arquivo não existir, vai para a lista
            if (hashes[caminhoRel] != hashLocal) {
                arqsUpload << [file: arquivo, path: caminhoRel]
            }
        }
        // Descobre o que tem no as versões antigas do servidor
        List<String> arqsDeletar = []
        List<String> arqsFicar = [
            "${nomeAppProv.get()}.jar".toString()
        ]
        hashes.keySet().each { caminhoRemoto ->
            if (!caminhosLocais.contains(caminhoRemoto) && !arqsFicar.contains(caminhoRemoto)) {
                arqsDeletar << caminhoRemoto
            }
        }
        // Sobe os arquivos
        println ">> INFO: ${hashes.size()} arquivos no servidor."
        // Deleta arquivos velhos
        if (!arqsDeletar.isEmpty()) {
            println ">> INFO: Encontrados ${arqsDeletar.size()} arquivos antigos. Limpando..."
            // Monta os caminhos absolutos protegidos por aspas
            String arquivosParaApagar = arqsDeletar.collect { "'${dir}/${it}'" }.join(' ')
            
            Process procRm = [
                'ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no', "${dono}@${sede}", 
                "rm -f ${arquivosParaApagar}"
            ].execute()
            procRm.waitForProcessOutput(System.out, System.err)
            
            if (procRm.exitValue() != 0) {
                println '>> AVISO: Não foi possível deletar arquivos antigos. Veja as permissões.'
            } else {
                arqsDeletar.each { println ">> INFO [DELETADO] -> ${it}" }
            }
        }
        if (arqsUpload.isEmpty()) {
            println '>> INFO: Nenhum arquivo foi modificado. Servidor já está 100% atualizado!'
        } else {
            println ">> INFO: ${arqsUpload.size()} alterações. Começando transferências..."
            // Garante que a pasta base existe no servidor
            Process procMkdir = [
                'ssh', '-o', 'StrictHostKeyChecking=no', "${dono}@${sede}", "mkdir -p ${dir}/lib"
            ].execute()
            procMkdir.waitForProcessOutput(System.out, System.err)
            // Faz o SCP pra cada arquivo
            arqsUpload.each { item ->
                println ">> INFO: Enviando -> ${item.path} (${item.file.length() / 1024} KB)"

                Process procScp = [
                    'scp', '-o', 'StrictHostKeyChecking=no', 
                    item.file.absolutePath, 
                    "${dono}@${sede}:${dir}/${item.path}"
                ].execute()
                // Saída padrão/erro do SCP direto no terminal
                procScp.waitForProcessOutput(System.out, System.err)
                
                if (procScp.exitValue() != 0) {
                    throw new GradleException("Falha ao transferir: ${item.path}")
                }
            }
        }
    }
}
