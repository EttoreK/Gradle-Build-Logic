// Declaração dos plugins da app
// plugins {}
plugins.apply(libs.plugins.buildLogicAndroidGeral.get().getPluginId()) // configurações do android
plugins.apply(libs.plugins.buildLogicAndroidActions.get().getPluginId()) // ações de build
// Propriedades do Projeto
Provider<Map<String, String>> progPropsProv = providers.of(LeitorProps) { 
    String nomeArq = providers.gradleProperty('progPropertiesNome').getOrElse('programa.properties')
    parameters.propertiesFile.set(new File(project.rootDir, nomeArq))
}
// Define o diretório de build
Provider<String> projNomeProv = progPropsProv.map { it.getOrDefault('projNome', 'Modelo') }
Provider<String> idPacoteProv = progPropsProv.map { it.getOrDefault('appIdPacote', 'com.modelo') }
Provider<String> mainPacoteProv = progPropsProv.map { it.getOrDefault('javaMainPacote', '.app') }
Provider<String> testPacoteProv = progPropsProv.map { it.getOrDefault('javaTestPacote', '.test') }
Provider<String> verNomeProv = progPropsProv.map { it.getOrDefault('appVerNome', '0.0.1') }
Provider<String> verNumProv = progPropsProv.map { it.getOrDefault('appVerNum', '1') }
project.layout.buildDirectory.set(project.layout.dir( progPropsProv.map { 
    new File(project.rootDir, it.getOrDefault('buildDirAndroid', 'build/java/android')) 
}))
// Definição das características do aplicativo
android {
    // ids para pacotes do app e testes
    namespace = idPacoteProv.get().concat(mainPacoteProv.get())
    testNamespace = idPacoteProv.get().concat(testPacoteProv.get())
    // Configurações padrão para o aplicativo Android
    defaultConfig {
        applicationId "${idPacoteProv.get()}.${projNomeProv.get()}" // id do aplicativo
        versionCode verNumProv.get().toInteger() // versão de registro no Google Play
        versionName verNomeProv.get() // nome da versão em exibição
    }

    bundle {
        abi {
            enableSplit = true // gera pacotes menores específicos para cada processador
        }
    }
    // Controle sobre compilaação
    buildFeatures{
        buildConfig = false
        viewBinding = true
    }
    // Controle de builds para o aplicativo
    buildTypes {
        // Regras para a release do aplicativo
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Regras para a debug do aplicativo
        debug {
            minifyEnabled = false // encolhimento de código
            shrinkResources = false
        }
    }
    // Controle de assinatura para distribuição
    signingConfigs {
        debug {
            // Usa as credenciais padrão do SDK
            storeFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }
    // Ativa a view binding para melhorar as views do aplicativo
    viewBinding {
        enable = true
    }
}
// Configuração para o nome do apk
androidComponents {
    onVariants(selector().all()) { variante -> // com.android.build.api.variant.Variant
        variante.outputs.forEach { output -> // com.android.build.api.variant.VariantOutput
            // Só calcula isso no exato milissegundo em que for gerar o APK
            output.outputFileName.set(
                output.versionCode.map { "${projNomeProv.get()}-${it}-${variante.name}.apk" }
            )
        }
    }
}
// Biblioteras para serem usadas no código
dependencies {
    androidTestImplementation libs.adrxTestCore // conversa com o Android
    androidTestImplementation libs.adrxTestEspresso // framework do Andoird para testes
    androidTestImplementation libs.adrxTestExtJunit // empacota tudo isso e manda o executor do Java
    androidTestImplementation libs.adrxTestRules // cria atalhos fáceis para abrir e fechar as telas
    implementation libs.material // experiência visual
    implementation libs.adrxActivity // base para fazer Activities
    implementation libs.adrxAppcompat // compatibilidade com versões antigas
    implementation libs.adrxAnnotat // necessário para usar @NonNull, @Nullable
    implementation libs.adrxLifeCycle // necessário pro classpath
    testImplementation libs.junitAPI // api dp Junit 5
    testImplementation libs.mockitoCore // para usar o mockito
    testImplementation libs.mockitoJunit // para mockar métodos estáticos
    testRuntimeOnly libs.junitEngine // engine do Junit 5
    testRuntimeOnly libs.junitPlt // necessário
}
