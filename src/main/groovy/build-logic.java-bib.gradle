// Declaração dos plugins
// plugins {}
// Define o diretório de build
Provider<Map<String, String>> progPropsProv = providers.of(LeitorProps) { 
    String nomeArq = providers.gradleProperty('progPropertiesNome').getOrElse('programa.properties')
    parameters.propertiesFile.set(new File(project.rootDir, nomeArq))
}
project.layout.buildDirectory.set(project.layout.dir( progPropsProv.map { 
    new File(project.rootDir, "${it.getOrDefault('buildDirJava', 'build/java')}/${project.name}") 
}))
// Manipulação do arquivo .classpath para o VSCODE parar de reclamar
project.tasks.register('posBuildBib') {
    group = 'Bib Actions'
    description = 'Ajusta o .classpath do VS Code para incluir escopos de teste em bibliotecas Java'
    // Pega a configuração e declara como um Input
    Provider<RegularFile> classpathArqProv = project.providers.provider { 
        project.layout.projectDirectory.file('.classpath') 
    }
    Provider<Set<FileSystemLocation>> testRuntime = project.configurations.named(
        'testRuntimeClasspath'
    ).flatMap { it.elements }

    inputs.files(testRuntime)
    outputs.upToDateWhen { false }
    
    doLast {
        File classpathArq = classpathArqProv.get().asFile
        // Se o VS Code não abriu e não gerou o arquivo, não faz nada.
        if (!classpathArq.exists() || !classpathArq.canWrite()) { return }
        
        String xmlArq = classpathArq.text
        StringBuilder novasEntradas = new StringBuilder()
        boolean eAlterado = false
        
        if (!xmlArq.contains('path="src/test/java"')) {
            novasEntradas.append(
                '    <classpathentry kind="src" output="bin/main" path="src/test/java">\n' +
                '        <attributes>\n' +
                '            <attribute name="gradle_scope" value="test"/>\n' +
                '            <attribute name="gradle_used_by_scope" value="test"/>\n' +
                '            <attribute name="test" value="true"/>\n' +
                '        </attributes>\n' +
                '    </classpathentry>\n'
            )
            eAlterado = true
        }
        
        if (testRuntime.isPresent()) {
            testRuntime.get().each { FileSystemLocation loc ->
                File arq = loc.asFile 
                String caminho = arq.absolutePath.replace(File.separator, '/')
                
                if (caminho.endsWith('.jar') && !xmlArq.contains("path=\"${caminho}\"")) {
                    novasEntradas.append("    <classpathentry kind=\"lib\" path=\"${caminho}\"/>\n")
                    eAlterado = true
                }
            }
        }
        
        if (eAlterado) {
            xmlArq = xmlArq.replace('</classpath>', "${novasEntradas.toString()}</classpath>")
            classpathArq.write(xmlArq)
            println ">> INFO: .classpath do VS Code atualizado com as bibliotecas de teste."
        }
    }
}
