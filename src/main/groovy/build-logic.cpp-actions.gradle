// Cria um objeto para o icone do aplicativo
Closure<Void> criaIcoWin = { File fundoSVG, File frenteSVG, File icoArq, File rcArq, 
    File obj32Arq, File obj64Arq ->
    if (!fundoSVG.exists()) throw new GradleException('Faltou o SVG de Fundo!')
    if (!frenteSVG.exists()) throw new GradleException('Faltou o SVG de Frente!')
    
    File buildDir = icoArq.parentFile
    if (!buildDir.exists()) buildDir.mkdirs()
        
    String msysDir = winDiscProv.get()
    String magickCmd = eWindowsProv.get() ? "${msysDir}:/msys64/ucrt64/bin/magick.exe" : 'magick'

    List<String> mesclaSVG = [
        magickCmd,
        '-background', 'none',
        fundoSVG.absolutePath, // carrega a imagem de trás
        frenteSVG.absolutePath, // carrega a imagem da frente
        '-gravity', 'center', // centraliza o alinhamento
        '-composite', // mescla as duas imagens
        '-define', 'icon:auto-resize=256,128,64,48,32,16', 
        icoArq.absolutePath // salva o resultado
    ]
    Process prcessoMesclar = mesclaSVG.execute()
    prcessoMesclar.waitForProcessOutput(System.out, System.err)
    if (prcessoMesclar.exitValue() != 0) { throw new GradleException('Falha ao mesclar') }

    rcArq.text = "id ICON \"${icoArq.absolutePath.replace(File.separator, '/')}\""

    Closure<Void> rodaWindres = { String cmd, File objArq, String extraDir ->
        ProcessBuilder pb = new ProcessBuilder(cmd, rcArq.absolutePath, '-o', objArq.absolutePath)
        
        if (eWindowsProv.get() && extraDir != null) {
            // Injeta a pasta bin exata no início do path do Windows
            pb.environment().put(
                'PATH', extraDir + File.pathSeparator + pb.environment().get('PATH')
            )
        }
        
        Process processo = pb.start()
        processo.waitForProcessOutput(System.out, System.err)
        if (processo.exitValue() != 0) {
            throw new GradleException("Falha no windres para ${objArq.name}")
        }
    }
    // Injeção isolada para 32 e 64 bits
    if (eWindowsProv.get()) {
        rodaWindres("${msysDir}:/msys64/mingw32/bin/windres.exe", 
            obj32Arq, "${msysDir}:/msys64/mingw32/bin")
        rodaWindres("${msysDir}:/msys64/ucrt64/bin/windres.exe", 
            obj64Arq, "${msysDir}:/msys64/ucrt64/bin")
    } else {
        rodaWindres('i686-w64-mingw32-windres', obj32Arq, null)
        rodaWindres('x86_64-w64-mingw32-windres', obj64Arq, null)
    }
}
// Tarefa Mestra que administra a Closure
tasks.register('winIco') {
    group = 'C++ Actions'
    description = 'Administra a conversão e compilação do ícone do Windows'

    Provider<RegularFile> fundoSvgProv = espolioDirProv.map { it.file('icones/appBackground.svg') }
    Provider<RegularFile> frenteSvgProv = espolioDirProv.map { it.file('icones/appForeground.svg') }
    Provider<RegularFile> obj32ArqProv = buildDirProv.map { it.file('icone32.o') }
    Provider<RegularFile> obj64ArqProv = buildDirProv.map { it.file('icone64.o') }

    inputs.files(fundoSvgProv, frenteSvgProv)
    outputs.files(obj32ArqProv, obj64ArqProv)
    
    doLast {
        File fundoSVG = fundoSvgProv.get().asFile
        File frenteSVG = frenteSvgProv.get().asFile
        File icoArq = buildDirProv.get().file('app.ico').asFile
        File rcArq = buildDirProv.get().file('app.rc').asFile
        File obj32Arq = obj32ArqProv.get().asFile
        File obj64Arq = obj64ArqProv.get().asFile
        criaIcoWin(fundoSVG, frenteSVG, icoArq, rcArq, obj32Arq, obj64Arq)
    }
}
// Tarefa para o ícone do Linux
tasks.register('linIco') {
    group = 'C++ Actions'
    description = 'Gera o ícone PNG do aplicativo para Linux'

    Provider<RegularFile> fundoSvgProv  = espolioDirProv.map { it.file('icones/appBackground.svg') }
    Provider<RegularFile> frenteSvgProv = espolioDirProv.map { it.file('icones/appForeground.svg') }
    Provider<RegularFile> pngArqProv = buildDirProv.map { it.file('app_linux.png') }
    
    inputs.files(fundoSvgProv, frenteSvgProv)
    outputs.file pngArqProv
    
    doLast {
        File fundoSVG = fundoSvgProv.get().asFile
        File frenteSVG = frenteSvgProv.get().asFile
        File pngArq = pngArqProv.get().asFile
        
        if (!fundoSVG.exists()) throw new GradleException('Faltou o SVG de Fundo!')
        if (!frenteSVG.exists()) throw new GradleException('Faltou o SVG de Frente!')
        
        File buildDir = pngArq.parentFile
        if (!buildDir.exists()) buildDir.mkdirs()
            
        String msysDir = "${winDiscProv.get()}:/msys64/ucrt64/bin/magick.exe"
        String magickCmd = eWindowsProv.get() ? "${msysDir}" : 'magick'
        List<String> mesclaSVG = [
            magickCmd,
            '-background', 'none',
            fundoSVG.absolutePath, 
            frenteSVG.absolutePath, 
            '-gravity', 'center', '-composite', 
            '-resize', '2048x2048', 
            pngArq.absolutePath 
        ]
        
        StringBuilder err = new StringBuilder()
        Process processo = mesclaSVG.execute()
        processo.waitForProcessOutput(System.out, err)
        if (processo.exitValue() != 0) {
            throw new GradleException("Falha ao gerar o ícone do Linux: ${err.toString().trim()}")
        }
    }
}
Closure<List> pegeDefinicoes = { String name -> return [
    name.contains('Release') ? 'Release' : 'Debug',
    name.contains('Windows') || name.contains('windows') ? 'Windows' : 'Linux',
    name.contains('X86') && !name.contains('X86-64') && !name.contains('x86_64') ? 'X86' : 'X86-64',
    name.contains('Test') || name.contains('test')
]}
// Faz a compilação C++ depender da geração desse arquivo primeiro
tasks.withType(CppCompile).configureEach {
    mustRunAfter tasks.named('criaEspolio') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaEspolio'))
    
    String config, alvo, arqtt // false = Native/Local
    (config, alvo, arqtt) = pegeDefinicoes(name)
    compilerArgs.addAll(project.providers.provider { pegaFlagsComp(alvo, arqtt, config, false)})
}
// Modifica a criação do executále para usar as bibliotecas necessárias
tasks.withType(LinkExecutable).configureEach {
    String config, alvo, arqtt
    boolean eTest 
    (config, alvo, arqtt, eTest) = pegeDefinicoes(name)
    linkerArgs.addAll(project.providers.provider { pegaFlagsLink(alvo, arqtt, config, eTest) })
}
