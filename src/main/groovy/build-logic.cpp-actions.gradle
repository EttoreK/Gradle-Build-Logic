tasks.register('buildLin64Release') { cbuild(it, 'Linux', 'X86-64', 'Release') }
tasks.register('buildLin32') { cbuild(it, 'Linux', 'X86', 'Debug') }
tasks.register('buildLin32Release') { cbuild(it, 'Linux', 'X86', 'Release') }
// Closure centralização de execução
Closure<Void> crun = { Task tarefa, String alvo, String arqtt, String config ->
    String appDir = "main/${config}/${alvo}/${arqtt}/lib".toLowerCase()
    String tarefaNativaNome = "install${config}${alvo}${arqtt}"
    String buildNome = "build${alvo == 'Windows' ? 'Win' : 'Lin'}${arqtt == 'X86' ? '32' : '64'}"

    tarefa.group = 'C++ Actions'
    tarefa.description = "Executa o binário ${alvo}-${arqtt}"
    tarefa.inputs.files(tasks.named("${buildNome}${config == 'Release' ? 'Release' : ''}"))
    tarefa.inputs.files(pegaArquivos(appDir))
    if (tasks.findByName(tarefaNativaNome)) {
        tarefa.inputs.files(tasks.named(tarefaNativaNome))
        tarefa.mustRunAfter tasks.named(tarefaNativaNome)
    }
    tarefa.outputs.upToDateWhen { false } // sempre executa

    tarefa.doFirst {
        String appNome = appNomeProv.get()
        String osAlvo = alvo.toLowerCase()
        String nomeExe = alvo == 'Windows' ? "${appNome}.exe" : appNome
        
        List<String> cmds
        if (eWindowsProv.get() && osAlvo == 'windows') {
            File exeDir = new File(instllDirProv.get().asFile, appDir)
            cmds = ["cd /d \"${exeDir.absolutePath}\"", '&&', 'start', '\"\"', nomeExe]
        } else {
            String appDirRemoto = "build/install/${appDir}"
            if (osAlvo == 'windows') { 
                cmds = ["cd \"${appDirRemoto.replace('/', '\\')}\"", '&&', 'start', '\"\"', nomeExe] 
            } else { 
                cmds = [
                    'export XDG_RUNTIME_DIR=/run/user/$(id -u)', '&&', 
                    'export WAYLAND_DISPLAY=wayland-0', '&&', 'export DISPLAY=:0', '&&', 
                    "cd \'${appDirRemoto}\'", '&&', 
                    "setsid sh -c \'exec ./${nomeExe} > /dev/null 2>&1 < /dev/null &\' > /dev/null 2>&1"
                ] 
            }
        }
        // Ícone do desktop só faz sentido se estiver rodando localmente no Linux
        if (osAlvo == 'linux' && eLinuxProv.get()) {desktop(
            appNome, new File(instllDirProv.get().asFile, "${appDir}/${nomeExe}").absolutePath
        )}

        println ">> INFO: Executando ${alvo}..."
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process precessoExecutar = comandoRemoto(osAlvo, cmds, dirDireto).execute()
        precessoExecutar.waitFor() // tem que ser waitFor() e não waitForProcessOutput()
        if (precessoExecutar.exitValue() != 0) { throw new GradleException('A execução falhou.') }
    }
}
// Tarefas de execução
tasks.register('runWin64') { crun(it, 'Windows', 'X86-64', 'Debug') }
tasks.register('runWin64Release') { crun(it, 'Windows', 'X86-64', 'Release') }
tasks.register('runWin32') { crun(it, 'Windows', 'X86', 'Debug') }
tasks.register('runWin32Release') { crun(it, 'Windows', 'X86', 'Release') }
tasks.register('runLin64') { crun(it, 'Linux', 'X86-64', 'Debug') }
tasks.register('runLin64Release') { crun(it, 'Linux', 'X86-64', 'Release') }
tasks.register('runLin32') { crun(it, 'Linux', 'X86', 'Debug') }
tasks.register('runLin32Release') { crun(it, 'Linux', 'X86', 'Release') }
// Centralização de teste
Closure<Void> ctest = { Task tarefa, String alvo, String arqtt, String config ->
    String testDir = "${alvo}/${arqtt}/lib".toLowerCase()
    String tarefaNativaNome = "installTest${alvo}${arqtt}"
    String buildNome = "build${alvo == 'Windows' ? 'Win' : 'Lin'}${arqtt == 'X86' ? '32' : '64'}"

    tarefa.group = 'C++ Actions' // grupo padrão para testes
    tarefa.description = "Executa os testes unitários em ${alvo}-${arqtt}"
    tarefa.inputs.files(tasks.named("${buildNome}${config == 'Release' ? 'Release' : ''}"))
    if (tasks.findByName(tarefaNativaNome)) {
        tarefa.inputs.files(tasks.named(tarefaNativaNome))
        tarefa.mustRunAfter tasks.named(tarefaNativaNome)
    }
    tarefa.outputs.upToDateWhen { false } // testes devem sempre rodar

    tarefa.doFirst {
        String appTestNome = "${appNomeProv.get()}Test" 
        String osAlvo = alvo.toLowerCase()
        String nomeExe = alvo == 'Windows' ? "${appTestNome}.exe" : appTestNome
        String relativo = buildDirProv.get().asFile.toPath().toString().replace('\\', '/').replace(
            projDirProv.get().asFile.toPath().toString().replace('\\', '/') + "/", ""
        )
        // Cópia local de recursos antes do teste
        File exeDirLocal = new File(buildDirProv.get().asFile, "install/test/${testDirRel}")
        copiaRes(exeDirLocal)
        // File exeDir = buildDirProv.get().dir('install/test').dir(testDir).asFile
        // String appDir = "${relativo}/install/test/${testDir}"
        // copiaRes(exeDir)

        if (osAlvo == 'linux') {
            println ">> INFO: Compilando Testes [${alvo}-${arqtt}] nativamente na VM..."
            String dirRemoto = "build/install/test/${testDir}"
            List<String> gppTestcmds = ['g++']
            gppTestcmds.addAll(pegaFlagsComp(alvo, arqtt, config, true))

            String pastaWayland = "build/tmp/wayland"
            gppTestcmds << "${pastaWayland}/xdg-shell-protocol.o"
            gppTestcmds << "-I${pastaWayland}"

            gppTestcmds.addAll(
                "\$(find src/main/cpp -name \'*.cpp\' ! -name \'app.cpp\')",
                "\$(find src/test/cpp -name \'*.cpp\')",
                '-o', "\'${dirRemoto}/${nomeExe}\'"
            )
            gppTestcmds.addAll(pegaFlagsLink(alvo, arqtt, config, true))

            Process processoCompilar = comandoRemoto(osAlvo, [
                "mkdir -p \'${dirRemoto}\'", '&&',
                gppTestcmds.join(' ')
            ]).execute()
            processoCompilar.waitForProcessOutput(System.out, System.err)

            if (processoCompilar.exitValue() != 0) {
                throw new GradleException('Falha ao compilar testes no Linux')
            }
        }
        
        List<String> cmds
        if (osAlvo == 'windows') {
            if (eWindowsProv.get()) {
                // Usa o diretório absoluto local do exeDir
                cmds = ["cd /d \"${exeDirLocal.absolutePath}\"", '&&', nomeExe]
            } else {
                String dirRemoto = "build/install/test/${testDir}"
                cmds = ["cd \"${dirRemoto.replace(File.separator, '/')}\"", '&&', nomeExe]
            }
        } else {
            cmds = [
                'export DISPLAY=:0', '&&',
                'export XAUTHORITY=$(ls /run/user/$(id -u)/gdm/Xauthority',
                '/run/user/$(id -u)/.mutter-Xwaylandauth*',
                '/run/user/$(id -u)/Xauthority',
                '~/.Xauthority 2>/dev/null | head -n 1)', 
                '&&', "cd \'${dirRemoto}\'", '&&', "./${nomeExe}"
            ]
        }

        println ">> INFO: Executando testes unitários em ${alvo}..."
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process processoTestar = comandoRemoto(
            osAlvo, cmds, dirDireto
        ).execute()
        processoTestar.waitForProcessOutput(System.out, System.err) // no teste, espera GTest acabar
        
        if (processoTestar.exitValue() != 0) {
            throw new GradleException('Os testes unitários do C++ falharam.')
        }
    }
}
