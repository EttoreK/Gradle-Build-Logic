// Copiar recursos para a saída
Closure<Void> copiaRes = { File destinoDir ->
    File espolioDir = espolioDirProv.get().asFile
    if (!espolioDir.exists()) {
        println ">> AVISO: Pasta ${espNomeProv.get()} não encontrada em: ${espolioDir}"
        return
    }

    File recursDir = new File(destinoDir, 'recursos')
    if (!recursDir.exists()) { recursDir.mkdirs() }
    
    println ">> INFO: Copiando recursos de '${espolioDir.name}' para '${recursDir.name}'..."
    // Caminha recursivamente por todos os arquivos do espolio
    espolioDir.eachFileRecurse { File dir ->
        // Calcula o caminho relativo
        File destDir = new File(recursDir, espolioDir.toPath().relativize(dir.toPath()).toString())

        if (dir.isDirectory()) {
            destDir.mkdirs()
        } else {
            destDir.parentFile.mkdirs()
            // Copia substituindo se existir
            java.nio.file.Files.copy(
                dir.toPath(), 
                destDir.toPath(), 
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
// Converte arquivos de espolio para hpp
Closure<Void> embuteRes = {
    File espolioDir = espolioDirProv.get().asFile
    File saidaHPP = new File(genDirProv.get().asFile, "${espNomeProv.get()}.hpp")

    if (!espolioDir.exists()) { return }
    saidaHPP.parentFile.mkdirs()

    List<String> arqvs = []
    StringBuilder hpp = new StringBuilder()

    hpp.append('#pragma once\n')
    hpp.append('#include <string>\n')
    hpp.append('#include <vector>\n')
    hpp.append('#include <map>\n\n')
    hpp.append("namespace ${espNomeProv.get()} {\n")

    espolioDir.eachFileRecurse { File arq ->
        if (arq.isFile()) {
            String dir = espolioDir.toPath().relativize(
                arq.toPath()).toString().replace(File.separator, '/')
            String nome = dir.replaceAll('[^a-zA-Z0-9]', '_')
            byte[] bytes = arq.readBytes()
            
            hpp.append("    const unsigned char ${nome}[] = {")
            hpp.append(bytes.collect { String.format('0x%02x', it) }.join(', '))
            hpp.append('};\n')
            
            arqvs.add("\t\t{\"${dir}\", std::vector<uint8_t>(${nome}, ${nome} + sizeof(${nome}))}")
        }
    }

    hpp.append('\n\tinline std::vector<uint8_t> Obter(const std::string& caminho) {\n')
    hpp.append('\t\tstatic std::map<std::string, std::vector<uint8_t>> arquivos = {\n')
    hpp.append(arqvs.join(',\n'))
    hpp.append('\n\t\t};\n')
    hpp.append('\t\tif (arquivos.count(caminho)) return arquivos[caminho];\n')
    hpp.append('\t\treturn {};\n')
    hpp.append('\t}\n')
    hpp.append('}\n')

    String arquivo = hpp.toString()
    // Só salva no disco se o conteúdo realmente mudou
    if (!saidaHPP.exists() || saidaHPP.text != arquivo) {
        saidaHPP.text = arquivo
    }
}
// Configura o ícone do aplicativo
Closure<Void> desktop = { String appNome, String caminhoExe ->
    File iconePNG = new File(buildDirProv.get().asFile, 'app_linux.png')

    File localIconsDir = new File(
        System.getProperty('user.home'), '.local/share/icons/hicolor/512x512/apps')
    if (!localIconsDir.exists()) localIconsDir.mkdirs()

    File iconeDir = new File(localIconsDir, "${appNome}.png")
    if (iconePNG.exists()) {
        java.nio.file.Files.copy(
            iconePNG.toPath(), 
            iconeDir.toPath(), 
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
    // Acessa a pasta oculta de aplicativos do usuário
    File localAppsDir = new File(System.getProperty('user.home'), '.local/share/applications')
    if (!localAppsDir.exists()) { localAppsDir.mkdirs() } // cria a pasta se não existir
    
    new File(localAppsDir, "${appNome}.desktop").text = """
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=${appNome}
        Exec=\"${caminhoExe}\"
        Icon=${appNome}
        Terminal=false
        StartupWMClass=Logger
        Categories=Utility;Development;
        """.stripIndent().trim()
    
    try {
        // Força o GNOME/Wayland a ler a pasta e atualizar os ícones na hora
        ([ 'update-desktop-database', 
            localAppsDir.absolutePath
        ]).execute().waitForProcessOutput(System.out, System.err)

        ([ 'gtk-update-icon-cache', '-f', '-t', 
            (new File(System.getProperty('user.home'), '.local/share/icons/hicolor')).absolutePath
        ]).execute().waitForProcessOutput(System.out, System.err)
    } catch(Exception e) {
        println '>> AVISO: update-desktop-database não rodou, mas o arquivo foi criado.'
    }
}
// Coleta as flags de compilação
Closure<List<String>> pegaFlagsComp = { String alvo, String arqtt, String config, Boolean eRemoto ->
    Directory projDir = projDirProv.get()
    List<String> flags = ['-std=c++26', '-Os']
    
    if (alvo.toLowerCase() == 'linux') { flags << '-I/usr/include/jsoncpp' }
    flags << (arqtt == 'X86' ? '-m32' : '-m64')
    // Diferencia Caminhos Locais Absolutos dos Caminhos SSH Relativos
    if (eRemoto) {
        flags << '-Isrc/main/headers'
        if (eWindowsProv.get() && alvo.toLowerCase() == 'windows') {
            flags << "-I${genDirProv.get().asFile.absolutePath.replace(File.separator, '/')}"
        } else {
            flags.addAll(['-Ibuild/tmp/generated', '-Ibuild/tmp'])
        }
    } else {
        flags.addAll([
            "-I${projDir.asFile.absolutePath.replace(File.separator, '/')}/src/main/headers",
            "-I${genDirProv.get().asFile.absolutePath.replace(File.separator, '/')}"
        ])
    }

    File bibDir = new File(projDir.asFile, 'src/main/bib')
    if (bibDir.exists()) {
        bibDir.eachDirRecurse { File dir ->
            if (eRemoto) {
                // Caminho relativo limpo para SSH
                String relativo = projDir.asFile.toPath().relativize(dir.toPath()).toString()
                flags << "-I${relativo.replace(File.separator, '/')}"
            } else {
                // Caminho absoluto local
                flags << "-I${dir.absolutePath.replace(File.separator, '/')}"
            }
        }
    }
    return flags
}
// Coleta as flags de Linkagem
Closure<List<String>> pegaFlagsLink = { String alvo, String arqtt, String config, Boolean eTeste ->
    List<String> flags = []
    if (config == 'Release') { flags.addAll(['-s']) }

    if (alvo.toLowerCase() == 'windows') {
        flags.addAll([
            // Força o uso de arquivos estáticos
            '-Wl,-Bstatic',
            '-Wl,--start-group', 
            // A Biblioteca Principal
            '-lcurl',
            '-ljsoncpp',
            // Protocolos de rede
            '-lnghttp2', // HTTP/2
            '-lnghttp3', // HTTP/3
            '-lngtcp2_crypto_ossl', // criptografia para QUIC/HTTP3
            '-lngtcp2', // QUIC/HTTP3
            '-lssh2', // para SFTP/SSH
            // Resolução de domínios e texto
            '-lpsl', // public Suffix List
            '-lidn2',
            '-lunistring',
            '-liconv',
            // Compressores
            '-lzstd',
            '-lbrotlidec',
            '-lbrotlicommon',
            // Criptografia Base
            '-lssl',
            '-lcrypto', // criptografia base
            '-lz', // compressão (frequentemente exigido pelo ssh2/ssl)
            '-lssl',
            '-lcrypto',
            '-lz',
            '-liconv',
            '-Wl,--end-group',
            // Volta para dinâmico
            '-Wl,-Bdynamic',
            '-Wl,--start-group', 
            // GUI do Windows
            '-lgdi32', 
            '-luser32', 
            '-luxtheme', 
            '-loleaut32', 
            '-lcomctl32', 
            '-lmsimg32',
            // Sistema, Rede e Criptografia nativa
            '-ladvapi32',
            '-lws2_32', // Winsock2 (Rede)
            '-lcrypt32', // criptografia/Certificados (Schannel)
            '-lwldap32', // resolve os erros __imp_ldap_
            '-liphlpapi', // resolve o erro `if_nametoindex`
            '-lbcrypt', // geralmente exigido pelo OpenSSL no Windows
            '-lsecur32', // resolve o erro InitSecurityInterfaceA
            '-Wl,--end-group'
        ])
        
        if (eTeste) { flags.addAll(['-lgtest', '-lgtest_main', '-lpthread']) }
         
        flags.addAll(['-static-libgcc', '-static-libstdc++'])
        // Esconde o console se for Release e não for Teste
        if (config == 'Release' && !eTeste) { flags << '-mwindows' }
    } 
    else if (alvo.toLowerCase() == 'linux') {
        if (arqtt == 'X86') {
            flags.addAll([
                '-m32', 
                '-Wl,-m,elf_i386', 
                '-L/usr/lib/i386-linux-gnu', 
                '/usr/lib/i386-linux-gnu/libjsoncpp.a'
            ])
        } else {
            flags.addAll([
                '-m64', 
                '-Wl,-m,elf_x86_64', 
                '-L/usr/local/lib', 
                '-L/usr/lib/x86_64-linux-gnu'
            ])
        }
        flags.addAll(['-Wl,-Bstatic', '-ljsoncpp'])
        
        if (eTeste) flags.addAll(['-lgtest', '-lgtest_main'])
        
        flags.addAll([
            '-Wl,-Bdynamic', 
            '-lwayland-client', 
            '-lfontconfig', 
            '-lcurl',
            '-pthread', 
            '-static-libgcc', 
            '-static-libstdc++'
        ])
    }
    return flags
}
// Envia os arquivos para a máquina virtual Linux
tasks.register('syncToLinux') {
    group = 'C++ Actions'
    description = 'Sincroniza os arquivos fonte para a VM Linux via SSH'
    onlyIf { eWindowsProv.get() }
    // Regras de inputs
    mustRunAfter tasks.named('criaEspolio') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaEspolio'))
    inputs.dir project.file('src')
    inputs.dir espolioDirProv
    outputs.upToDateWhen { true } // executa só 1 vez
    
    doFirst {
        // Prepara as pastas no Linux, adiciona o tmp e icones explicitamente
        comandoRemoto('linux', 
            ['mkdir', '-p', "${linDirProv.get()}/build/tmp", "${linDirProv.get()}/build/icons"]
        ).execute().waitForProcessOutput(System.out, System.err)
    }
    
    doLast {
        String sshLogin = "${linDonoProv.get()}@${linSedeProv.get()}"
        String base = linDirProv.get()
        Directory projDir = projDirProv.get()
        
        println '>> INFO: [Linux] Enviando arquivos fonte e recursos...'
        Process processoSCP = (['scp', '-r', '-p', 
            projDir.dir('src').asFile.absolutePath.replace(File.separator, '/'), 
            espolioDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshLogin}:${base}/"
        ]).execute(null, projDir.asFile)
        processoSCP.waitForProcessOutput(System.out, System.err)
        if (processoSCP.exitValue() != 0) throw new GradleException('Falha no upload dos fontes!')
        
        println '>> INFO: [Linux] Enviando header gerado...'
        Process scpGen = (['scp', '-r', '-p', 
            genDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshLogin}:${base}/build/tmp/"
        ]).execute(null, projDir.asFile)
        scpGen.waitForProcessOutput(System.out, System.err)
        if (scpGen.exitValue() != 0) throw new GradleException('Falha no upload do espolio.hpp!')

        println '>> INFO: [Linux] Enviando ícone...'
        File iconePNG = new File(buildDirProv.get().asFile, 'app_linux.png')
        if (iconePNG.exists()) {
            Process scpIco = (['scp', '-p', 
                iconePNG.absolutePath.replace(File.separator, '/'), 
                "${sshLogin}:${base}/build/icons/"
            ]).execute(null, projDir.asFile)
            scpIco.waitForProcessOutput(System.out, System.err)
        }
        
        println '>> INFO: Sincronização para Linux concluída!'
    }
}
