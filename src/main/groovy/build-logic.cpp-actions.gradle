// Limpa o ambiente para melhores resultados
tasks.register('cleanC') {
    group = 'C++ Actions'
    description = 'Limpa os diretórios de build C++ localmente e nas VMs (via SSH)'

    doLast {
        File dirLocal = buildDirProv.get().asFile
        if (dirLocal.exists()) {
            println '>> INFO: [Local] Limpando diretório de build C++...'
            dirLocal.deleteDir()
        }
        // Limpeza Remota na VM Linux
        if (eWindowsProv.get()) {
            try {
                println '>> INFO: [Linux] Limpando diretório remoto via SSH...'
                // Manda um rm -rf na pasta build da VM Linux
                comandoRemoto(
                    'linux', ["rm -rf \'${linDirProv.get()}/build\'"]
                ).execute().waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Linux. Ela pode estar desligada.' 
            }
        }
        // Limpeza Remota na VM Windows
        if (eLinuxProv.get()) {
            try {
                println '>> INFO: [Windows] Limpando diretório remoto via SSH...'
                // Manda um rmdir (cmd) na pasta build da VM Windows
                comandoRemoto(
                    'windows', ["rmdir /s /q \"${winDirProv.get()}/build\""]
                ).execute().waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Windows. Ela pode estar desligada.' 
            }
        }
    }
}
// Certifica que o espolio entrará nos arquivos
tasks.register('criaEspolio') {
    group = 'C++ Setup'
    description = 'Converte os arquivos dos recursos em um Header C++'
    inputs.dir espolioDirProv
    outputs.file(new File(genDirProv.get().asFile, "${espNomeProv.get()}.hpp"))
    
    doLast { 
        embuteRes() 

        String chave = secretoPropsProv.get().getOrDefault('APP_CHAVE_CONF', 'CHAVE_FALTANDO')
        File segHpp = new File(genDirProv.get().asFile, 'seguranca.hpp')
        segHpp.parentFile.mkdirs()
        segHpp.text = "#pragma once\n#define APP_CHAVE_CONF \"${chave}\"\n"
    }
}
// Verifica e instala dependências automaticamente
tasks.register('instalaDeps') {
    group = 'C++ Setup'
    description = 'Instala dependências do Pacman via MSYS2 Bash ou Bash'
    outputs.upToDateWhen { false } // sempre executa

    doLast {
        println '>> INFO: Instalando dependências do Windows...'
        List<String> winDeps = [
            'mingw-w64-ucrt-x86_64-jsoncpp',
            'mingw-w64-i686-jsoncpp',
            'mingw-w64-ucrt-x86_64-toolchain',
            'mingw-w64-i686-toolchain',
            'mingw-w64-ucrt-x86_64-imagemagick',
            'mingw-w64-ucrt-x86_64-librsvg',
            'mingw-w64-ucrt-x86_64-gtest',
            'mingw-w64-i686-gtest',
            'mingw-w64-ucrt-x86_64-curl',
            'mingw-w64-i686-curl',
            'mingw-w64-ucrt-x86_64-ngtcp2',
            'mingw-w64-i686-ngtcp2',
            'mingw-w64-ucrt-x86_64-nghttp3',
            'mingw-w64-i686-nghttp3',
            'mingw-w64-ucrt-x86_64-nghttp2',
            'mingw-w64-i686-nghttp2',
            'mingw-w64-ucrt-x86_64-libssh2',
            'mingw-w64-i686-libssh2',
            'mingw-w64-ucrt-x86_64-libpsl',
            'mingw-w64-i686-libpsl'
        ]
        try {
            Process processoWin = comandoRemoto('windows', [
                "${winDiscProv.get()}:/msys64/usr/bin/bash.exe -l -c",
                "\"pacman -S --needed --noconfirm ${winDeps.join(' ')}\""
            ]).execute()
            processoWin.waitForProcessOutput(System.out, System.err) 
            
            if (processoWin.exitValue() != 0) {
                println ">> ERRO: Falha ao instalar no Windows (Código: ${processoWin.exitValue()})"
            }
        } catch(Exception e) { println ">> AVISO: VM Windows indisponível." }

        println '>> INFO: Instalando dependências do Linux...'
        List<String> linDeps = [
            'build-essential',
            'cmake',
            'g++-multilib',
            'libc6-dev-i386',
            'libwayland-dev',
            'libwayland-dev:i386', 
            'libwayland-bin',
            'wayland-protocols',
            'libfontconfig1-dev',
            'libfontconfig1-dev:i386',
            'libgtest-dev',
            'libjsoncpp-dev',
            'libjsoncpp-dev:i386',
            'imagemagick',
            'librsvg2-bin',
            'libcurl4-openssl-dev',
            'libcurl4-openssl-dev:i386'
        ]
        try {
            Process processoLin = comandoRemoto('linux', [ // Adiciona a arquitetura i386
                "sudo dpkg --add-architecture i386", "&&", 
                "sudo apt update", "&&", 
                "sudo apt install", "-y", "${linDeps.join(' ')}"
            ]).execute()
            processoLin.waitForProcessOutput(System.out, System.err)
            
            if (processoLin.exitValue() != 0) {
                println ">> ERRO: Falha ao instalar no Linux (Código: ${processoLin.exitValue()})"
            }
        } catch(Exception e) { println ">> AVISO: VM Linux indisponível." }
    }
}
// Centralização de compilação
Closure<Void> cbuild = { Task tarefa, String alvo, String arqtt, String config ->
    String osAlvo = alvo.toLowerCase()

    tarefa.group = 'C++ Actions'
    tarefa.description = "Compila nativamente via SSH em ${alvo}-${arqtt}"
    // O build aguarda o Sync, se for remoto, ou a Geração, se for local
    if (osAlvo == 'windows' && eLinuxProv.get()) {
        tarefa.inputs.files(tasks.named('syncToWindows'))
    } else if (osAlvo == 'linux' && eWindowsProv.get()) {
        tarefa.inputs.files(tasks.named('syncToLinux'))
    } else {
        tarefa.inputs.files(tasks.named('criaEspolio'))
        tarefa.inputs.files(tasks.named((osAlvo == 'windows' ? 'winIco' : 'linIco')))
    }

    tarefa.doLast {
        List<String> gppFlags = []
        String appDir = "main/${config}/${alvo}/${arqtt}/lib".toLowerCase()
        // String appDir = "${relativo}/main/${config}/${alvo}/${arqtt}/lib".toLowerCase()
        if (osAlvo == 'windows') {
            gppFlags.add(
                "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin/g++.exe"
            )
        } else {
            gppFlags << 'g++'
        }

        gppFlags.addAll(pegaFlagsComp(alvo, arqtt, config, true)) // injeção de flags

        Directory projDir = projDirProv.get()
        File cppDir = new File(projDir.asFile, 'src/main/cpp')
        if (cppDir.exists()) {
            cppDir.eachFileRecurse(groovy.io.FileType.FILES) { File arq ->
                if (arq.name.endsWith('.cpp')) {
                    gppFlags.add(projDir.asFile.toPath().relativize(
                        arq.toPath()).toString().replace(File.separator, '/')
                    )
                }
            }
        }
        // Insere do ícone do Windows
        if (osAlvo == 'windows') {
            if (eWindowsProv.get()) { 
                gppFlags.add((new File(
                    buildDirProv.get().asFile, (arqtt == 'X86' ? 'icone32.o' : 'icone64.o')
                )).absolutePath.replace(File.separator, '/'))
            } else { 
                gppFlags << (arqtt == 'X86' ? 'build/icons/icone32.o' : 'build/icons/icone64.o')
            }
        }

        gppFlags.addAll(pegaFlagsLink(alvo, arqtt, config, false)) // injeção de flags
        String appNome = appNomeProv.get()
        String nomeExe = alvo == 'Windows' ? "${appNome}.exe" : appNome
        String saidaDir // saída do binário
        // Prepara o Wayland remotamente (Apenas para Linux)
        if (osAlvo == 'linux') {
            String xmlArq = '/usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml'
            String pasta = "build/tmp/wayland" // pasta dentro da VM
            String gccArqtt = arqtt == 'X86' ? '-m32' : '-m64'
            String wlCmd = "mkdir -p ${pasta} && " +
                "wayland-scanner client-header ${xmlArq} ${pasta}/xdg-shell-client-protocol.h && " +
                "wayland-scanner private-code ${xmlArq} ${pasta}/xdg-shell-protocol.c && " +
                "gcc ${gccArqtt} -c ${pasta}/xdg-shell-protocol.c -o ${pasta}/xdg-shell-protocol.o"
            
            comandoRemoto(osAlvo, [wlCmd]).execute().waitForProcessOutput(System.out, System.err)
            // Adiciona o C gerado do Wayland na compilação e a pasta no Include
            gppFlags << "${pasta}/xdg-shell-protocol.o"
            gppFlags << "-I${pasta}"
        }

        if (eWindowsProv.get() && osAlvo == 'windows') {
            // Local no Windows usa Caminho Absoluto direto, sem matemática
            File destFolder = new File(instllDirProv.get().asFile, appDir)
            destFolder.mkdirs()
            saidaDir = new File(destFolder, nomeExe).absolutePath.replace('\\', '/')
        } else {
            // Remoto no SSH sempre será "build/..." a partir da raiz da VM
            String appDirRemoto = "build/install/${appDir}"
            String dirCmd = (osAlvo == 'windows' ? "if not exist \"${appDirRemoto.replace('/', '\\')}\" mkdir \"${appDirRemoto.replace('/', '\\')}\"" : "mkdir -p '${appDirRemoto}'")
            comandoRemoto(osAlvo, [dirCmd]).execute().waitForProcessOutput()
            saidaDir = "${appDirRemoto}/${nomeExe}"
        }
        gppFlags << '-o' << "\"${saidaDir}\""

        println ">> INFO: Compilando [${alvo}-${arqtt}] nativamente na VM..."
        // Passa o caminho exato do MSYS2 para blindar as DLLs do Windows
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process processoCompilar = comandoRemoto(osAlvo, [gppFlags.join(' ')], dirDireto).execute()
        processoCompilar.waitForProcessOutput(System.out, System.err) // devolve a saída limpa
        
        if (processoCompilar.exitValue() != 0) {
            throw new GradleException("Falha na compilação do C++ [${alvo}-${arqtt}]")
        }
        println ">> INFO: Sucesso! Binário salvo em: ${saidaDir}"
    }
}
// Tarefas de build
tasks.register('buildWin64') { cbuild(it, 'Windows', 'X86-64', 'Debug') }
tasks.register('buildWin64Release') { cbuild(it, 'Windows', 'X86-64', 'Release') }
