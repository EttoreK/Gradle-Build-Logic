    mustRunAfter tasks.named('criaAsseios')
    inputs.files(tasks.named('criaAsseios'))

    String config = name.contains('Release') ? 'Release' : 'Debug'
    String alvo = (name.contains('Windows') || name.contains('windows')) ? 'Windows' : 'Linux'
    String arqtt = (name.contains('X86') && !name.contains('X86-64') && !name.contains('x86_64'))
        ? 'X86' : 'X86-64'
    compilerArgs.addAll(providers.provider { pegaFlamasCompWeb(alvo, arqtt, config, false) })
}

