// Busca um simulador de iOS disponível e armazena em cache
Closure<String> pegaSimulador = {
    String simuladorUsual = simuladorUsualProv.get()
    String saida = ''
    // Executa o comando para listar os dispositivos simulados em JSON
    try { // O try/catch age como ignoreExitValue, se o comando falhar a saida continua vazia
        ByteArrayOutputStream saidaStd = new ByteArrayOutputStream()
        ByteArrayOutputStream erroStd = new ByteArrayOutputStream() // captura o erro
        Process processo = xcConfig.comandoRemoto(['xcrun', 'simctl list -j devices']).execute()
        processo.waitForProcessOutput(saidaStd, erroStd) // pega a saída e espera o comando terminar
        String erro = erroStd.toString().trim()
        saida = saidaStd.toString().trim()

        if (!erro.isEmpty()) { println ">> ERRO: falha ao listar simuladores. ${erro}" }
    } catch (Exception e) { 
        println ">> AVISO: falha ao executar. Usando '${simuladorUsual}'. ${e.message}" 
    }
    // Verifica se o comando produziu alguma saída
    if (saida.isBlank()) {
        println ">> AVISO: falha ao pegar simulador instalado. Usando '${simuladorUsual}'."
        return simuladorUsual
    }
    // Pega todos os dispositivos de todos os runtimes em uma única lista
    try {
        Map<String, Object> jsonSaidaMap = new groovy.json.JsonSlurper().parseText(saida)
        List<Map<String, Object>> aparelhos = jsonSaidaMap.devices.values().flatten()
        // PRIORIDADE 1: Encontrar qualquer simulador que já esteja ativo ('Booted')
        Map<String, Object> aparelhoAtivoMap = aparelhos.find { it.state == 'Booted' }
        if (aparelhoAtivoMap) { return aparelhoAtivoMap.name }
        // PRIORIDADE 2: Se nenhum estiver ativo, encontrar o primeiro iPhone ou iPad disponível
        Map<String, Object> aparelhoPreparadoMap = aparelhos.find {
            it.isAvailable && (it.name.startsWith('iPhone') || it.name.startsWith('iPad'))
        }
        if (aparelhoPreparadoMap) { return aparelhoPreparadoMap.name }
    } catch (Exception e) { 
        println ">> AVISO: falha de leitura. Usando '${simuladorUsual}'. ${e.message}" 
    }
    return simuladorUsual
}
