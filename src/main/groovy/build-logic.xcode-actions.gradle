// Cria um arquivo .xcarchive para distribuição
Closure<Void> xarchive = { Task tarefa, String platforma, String sdk ->
    tarefa.description = "Cria um arquivo .xcarchive para ${platforma.toUpperCase()} (Release)"
    tarefa.group = 'Xcode Actions'
    tarefa.inputs.dir xcConfig.srcDir.get()
    tarefa.inputs.dir xcConfig.xcodeProj.get()
    tarefa.inputs.files(tasks.named('syncToMac'))

    Provider<RegularFile> archiveArqProv = project.layout.file(project.provider { 
        new File(raizDir, pegaArchiveDir(platforma)) 
    })
    Provider<String> categoriaProv = progPropsProv.map { 
        it.getOrDefault('apple.category', 'app-store-connect') 
    }

    tarefa.outputs.file(xcConfig.eMac.flatMap { Boolean ehMac ->
        ehMac ? archiveArqProv : providers.provider { null }
    }).optional()
    // O Archive usa uma configuração específica de Release
    tarefa.executable = pegaExecutavelBase()
    tarefa.argumentProviders.add(new CommandLineArgumentProvider() {
        @Input Provider<String> getIdTimeProv() { xcConfig.idTime }
        @Input Provider<String> getCategoriaProv() { categoriaProv }
        @Input Provider<String> getNomePerfilProv() { nomePerfilProv }

        @Override Iterable<String> asArguments() {
            String idTime = getIdTimeProv().get()
            String categoria = getCategoriaProv().get()
            String perfil = getNomePerfilProv().get()
            
            List<String> comandos = [
                'xcrun', 'xcodebuild', 'archive',
                '-project', xcConfig.xcodeProj.get(),
                '-scheme', "${xcConfig.nomeApp.get()}-${platforma == 'ios' ? 'iOS' : 'macOS'}",
                '-sdk', sdk,
                '-archivePath', pegaArchiveDir(platforma),
                'BUILD_LIBRARY_FOR_DISTRIBUTION=YES',
                "INFOPLIST_KEY_LSApplicationCategoryType=public.app-category.${categoria}"
            ]
            // Configuração de destino, iOS precisa de destino explícito
            if (platforma == 'ios') { comandos.addAll([ '-destination', 'generic/platform=iOS' ]) }
            else { comandos.addAll([ '-destination', 'platform=macOS' ]) }
            // Configuração de credenciais
            if (idTime != 'TAPABURACO') { comandos.addAll([ 
                'CODE_SIGNING_REQUIRED=YES', "DEVELOPMENT_TEAM=${idTime}",
                "CODE_SIGN_IDENTITY=\'Apple Distribution: ${perfil} (${idTime})\'", 
                "PROVISIONING_PROFILE_SPECIFIER=\'${perfil}\'"
            ])} else { comandos.addAll([ 
                'CODE_SIGN_IDENTITY=-', 'CODE_SIGNING_ALLOWED=NO', 'CODE_SIGNING_REQUIRED=NO', 
                'PROVISIONING_PROFILE=', 'PROVISIONING_PROFILE_SPECIFIER=' 
            ])}

            return xcConfig.comandoRemoto(comandos).drop(1)
        }
    })
}
