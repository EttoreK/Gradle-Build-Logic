// Busca a versão swift instalada na VM
Closure<String> pegaVersaoSwift = {
    try {
        ByteArrayOutputStream saidaStd = new ByteArrayOutputStream()
        ByteArrayOutputStream erroStd = new ByteArrayOutputStream()
        Process processo = x.auxs.comandoRemoto(['swift', '--version']).execute()
        processo.waitForProcessOutput(saidaStd, erroStd)
        String saida = saidaStd.toString('UTF-8').trim()
        String erro = erroStd.toString('UTF-8').trim()
        java.util.regex.Matcher versao = (saida =~ /Swift version (\d+(?:\.\d+)*)/)

        if (!erro.isEmpty() && !erro.contains('swift-driver version:')) { 
            println ">> ERRO: falha ao extrair versão Swift: ${erro}" 
        }
        if (versao.find()) { return versao.group(1) }
    } catch (Exception e) { println ">> AVISO: versão Swift ausente. Usando padrão. ${e.message}" }
    return x.auxs.ver.swift.get() 
}
// Gera um UUID aleatório de 24 caracteres, diferente em cada geração, para builds limpas
Closure<String> criaUuid = {
    java.util.UUID.randomUUID().toString().replace('-', '').substring(0, 24).toUpperCase() 
}
// Pega um UUID existente do mapa uuids ou cria um novo se não existir
Closure<String> pegaUuid = { Map uuidsMap, String... dir -> return dir[0..-2].inject(uuidsMap) { 
    Map map, String key -> map.get(key, [:]) }.get(dir[-1], criaUuid()) 
}
// Pega ou cria uma lista de seções dentro do mapa ePBX
Closure<List<String>> pegaLista = { Map map, String nome -> return map.computeIfAbsent(nome) {[]} }
// Substitui a lógica de mapa e default.value
Closure<String> pegaExtensao = { String extensao -> String chave = extensao.toLowerCase()
    final Map<String, String> exts = [
        file: 'file.',
        gif: 'image.gif',
        jpeg: 'image.jpeg',
        jpg: 'image.jpeg',
        json: 'text.json',
        plist: 'text.plist.xml',
        png: 'image.png',
        storyboard: 'file.storyboard',
        swift: 'sourcecode.swift',
        xcassets: 'folder.assetcatalog',
        xib: 'file.xib'
    ]
    
    return exts.get(chave, "${exts['file']}${chave}")
}
