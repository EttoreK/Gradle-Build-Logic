// Construtores de elementos de Build Settings
Closure<String> configuraBuild = { String nome, String alvo, String tipo, String config,
    String idPacote, String nomeApp, String verSwift, String plataforma ->
    String testeTipo = alvo ? (tipo.contains('ui') ? 'UI' : '') : null
    String buildXDir = x.provs.buildXDirProv.get()
    String comum = """
        ENABLE_APP_INTENTS_METADATA_EXTRACTION = NO;
        GENERATE_INFOPLIST_FILE = YES;
        SWIFT_VERSION = \"${verSwift}\";
        ${config == 'Debug' ? 'ENABLE_TESTABILITY = YES;' : ''}"""
    String comumApp = comum + """
        PRODUCT_BUNDLE_IDENTIFIER = \"${idPacote}.${plataforma}\";
        INFOPLIST_KEY_CFBundleShortVersionString = \"${x.provs.versaoNumeroProv.get()}\";
        INFOPLIST_KEY_CFBundleVersion = \"${x.provs.versaoNumeroProv.get()}\";
        INFOPLIST_KEY_UIApplicationSceneManifest_EnableMultipleWindows = NO;
        PRODUCT_NAME = \"${nomeApp}\";
        PRODUCT_MODULE_NAME = \"${nomeApp}\";
        ASSETCATALOG_COMPILER_APPICON_NAME = \"AppIcon\";"""
    String comumTeste = comum + """
        PRODUCT_BUNDLE_IDENTIFIER = \"${idPacote}.${testeTipo}Tests.${plataforma}\";
        PRODUCT_NAME = \"${nome}\";
        TEST_TARGET_NAME = \"${alvo}\";
        ${testeTipo == 'UI' ? 'USES_XCTRUNNER = YES;' : 'BUNDLE_LOADER = \"\$(TEST_HOST)\";'}
        ${plataforma == 'ios' ? 'TARGETED_DEVICE_FAMILY = \"1,2\";' : ''}"""
    String comumIos = """
        IPHONEOS_DEPLOYMENT_TARGET = \"${x.auxs.ver.minIosVer.get()}\";
        SDKROOT = \"${(tipo == 'appios' && config == 'Release') ? 'iphoneos' : 'iphonesimulator'}\";
        SUPPORTED_PLATFORMS = \"iphonesimulator iphoneos\";"""
    String comumMacos = """
        MACOSX_DEPLOYMENT_TARGET = \"${x.auxs.ver.minMacosVer.get()}\";
        SDKROOT = \"macosx\"; 
        SUPPORTED_PLATFORMS = \"macosx\";"""
    
    switch (tipo) {
        case 'main': return """
            ALWAYS_SEARCH_USER_PATHS = NO;
            SYMROOT = \"\$(PROJECT_DIR)/../${buildXDir}/products\";
            OBJROOT = \"\$(PROJECT_DIR)/../${buildXDir}/intermediates\";
            SHARED_PRECOMPS_DIR = \"\$(OBJROOT)/PrecompiledHeaders\";
            CONFIGURATION_BUILD_DIR = \"\$(SYMROOT)/\$(CONFIGURATION)-\$(PLATFORM_NAME)\";"""
            break
        case 'appios': return (comumApp + comumIos).indent(4)            
            break
        case 'appmacos': return (comumApp + comumMacos).indent(4) + """
            COMBINE_HIDPI_IMAGES = YES;"""
            break
        case 'unitios': return (comumTeste + comumIos).indent(4) + """
            TEST_HOST = \"\$(BUILT_PRODUCTS_DIR)/${nomeApp}.app/${nomeApp}\";"""
            break
        case 'unitmacos': return (comumTeste + comumMacos).indent(4) + """
            TEST_HOST = \"\$(BUILT_PRODUCTS_DIR)/${nomeApp}.app/Contents/MacOS/${nomeApp}\";"""
            break
        case 'uiios': return (comumTeste + comumIos).indent(4) + """
            PROVISIONING_PROFILE = \"\";"""
            break
        case 'uimacos': return (comumTeste + comumMacos).indent(4)
            break
        default: return ''
    }
}
