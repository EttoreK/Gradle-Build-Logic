// Construtor de elementos NativeTarget para o .pbxproj
Closure<String> criaPBXNativeTarget = { String alvoId, String nomeCompleto, String listaConfigId, 
    List<String> fasesIds, List<String> depIds, String nome, String fileRefId, String tipo -> 
    String ids = String.join('\n', 'dependencies = (', depIds.join('\n').indent(12))
    String ext = tipo.contains('app') ? 'app' : (tipo.contains('test') ? 'xctest' : 'unknown')
    return """
    ${alvoId} /* ${nomeCompleto} */ = {
        isa = PBXNativeTarget;
        buildConfigurationList = ${listaConfigId} /* Lista para configurar \"${nomeCompleto}\" */;
        buildPhases = (
            ${fasesIds ? fasesIds.join(',\n').indent(12).strip() : ''}
        );
        ${tipo != 'application' ? ids.strip() + '\n);'.indent(8) : ''}
        name = \"${nomeCompleto}\";
        productName = \"${nome}\";
        productReference = ${fileRefId} /* ${nomeCompleto}.${ext} */;
        productType = \"com.apple.product-type.${tipo}\";
    };"""
}
