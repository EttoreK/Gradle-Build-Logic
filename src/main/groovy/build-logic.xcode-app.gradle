// Centraliza File Reference e BuildFile para evitar repetição
Closure<Map<String, String>> processaArqRefs = { Map uuids, Map ePBX, String rastro, String dir ->
    String caminho = rastro.replace(File.separator, '/')
    String nomeExib = rastro.contains('/') ? rastro.substring(rastro.lastIndexOf('/') + 1) : rastro
    String ref = pegaUuid(uuids, 'fileRef', rastro) 
    String buildRef = pegaUuid(uuids,'buildRef', rastro)
    String ext = nomeExib.contains('.') ? nomeExib.substring(nomeExib.lastIndexOf('.') + 1) : ''
    String tipoArq = pegaExtensao(ext)

    pegaLista(ePBX, 'FileReference') << criaFileReference(ref, nomeExib, caminho, tipoArq)
    pegaLista(ePBX, 'PBXBuildFile') << criaBuildFile(buildRef, nomeExib, ref)

    return [nome: nomeExib, caminho: caminho, ref: ref, buildRef: buildRef]
}
