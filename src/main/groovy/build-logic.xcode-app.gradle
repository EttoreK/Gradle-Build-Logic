// Busca a versão swift instalada na VM
Closure<String> pegaVersaoSwift = {
    try {
        ByteArrayOutputStream stdout = new ByteArrayOutputStream()
        ByteArrayOutputStream stderr = new ByteArrayOutputStream()
        Process processo = x.comandoRemoto(['swift', '--version']).execute()
        processo.waitForProcessOutput(stdout, stderr)
        String saida = stdout.toString('UTF-8').trim()
        String erro = stderr.toString('UTF-8').trim()
        java.util.regex.Matcher versao = saida =~ /Swift version (\d+(?:\.\d+)*)/

        if (!erro.isEmpty() && !erro.contains('swift-driver version:')) { 
            println "AVISO (stderr): Erro ao extrair versão Swift: ${erro}" 
        }
        if (versao.find()) { return versao.group(1) }
    } catch (Exception e) { println "ERRO: ao executar comando Swift. Usando padrão. ${e.message}" }
    return x.ver.swift.get() 
}
// Gera um UUID aleatório de 24 caracteres, diferente em cada geração, para builds limpas
Closure<String> criaUuid = { 
    java.util.UUID.randomUUID().toString().replace('-', '').substring(0, 24).toUpperCase() 
}
// Pega um UUID existente do mapa uuids ou cria um novo se não existir
Closure<String> pegaUuid = { Map uuids, String... path -> 
    return path[0..-2].inject(uuids) { map, key -> map.get(key, [:]) }.get(path[-1], criaUuid()) 
}
// Pega ou cria uma lista de seções dentro do mapa ePBX
