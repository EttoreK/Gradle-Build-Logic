// Busca um arquivo que possua a propriedade buildlogicNome para definir como propsRaiz
final Properties propsRaiz = new Properties()
settingsDir.parentFile.listFiles().any { final File arq ->
    if (arq.isFile() && arq.canRead()) {
        arq.withInputStream { propsRaiz.load(it) }
        if (propsRaiz.libsDir != null) { return true } 
        else { propsRaiz.clear() }
    }
}
// Resolução de dependências
dependencyResolutionManagement {
    // Aonde buscar para cumprir as dependências
    repositories {
        google() // repositório oficial do google
        mavenCentral() // dependências de java e android
        gradlePluginPortal() // dependências especificas do gradle
    }
    // Acesso ao libs.versions.toml
    versionCatalogs {
        // Busca e define o libs.versions.toml como libs e usa como catálogo de versão
        create(new File(propsRaiz.libsDir).name[0..3]) {
            from(files(propsRaiz.libsDir))
        }
    }
}

rootProject.name = settingsDir.name // nome da pasta do projeto