// Declaração dos plugins
// plugins {}
// Provedores para acesso lazy às variáveis
Object ver = libs.versions
// Configurações Java para compilaçõa
java {
    // Versão java para compilar o código e manter a compatibilidade
    sourceCompatibility = JavaVersion.toVersion(ver.javaSource.get())
    targetCompatibility = JavaVersion.toVersion(ver.javaTarget.get())
    // Garante qeu o java que compila seja o definido
    toolchain {
        languageVersion = JavaLanguageVersion.of(ver.javaSource.get().toInteger())
    }
}
// Biblioteras para serem usadas no código
dependencies {
    compileOnly libs.jetBsAnnot // biblioteca padrão para @Nullable e @NonNull
    testImplementation libs.mockitoCore // para usar o mockito
    testImplementation libs.mockitoJunit // para mockar métodos estáticos
}
// Aplica o tipo de teste como JUnit
test {
    useJUnitPlatform()
}