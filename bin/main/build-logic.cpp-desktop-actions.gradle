    return layout.files(instllDirProv.map { it.dir(subDir) })
}
// Configura o ícone do aplicativo
Closure<Void> desktop = { String appNome, String caminhoExe ->
    File iconePNG = new File(buildDirProv.get().asFile, 'app_linux.png')

    File localIconsDir = new File(
        System.getProperty('user.home'), '.local/share/icons/hicolor/512x512/apps'
    )
    if (!localIconsDir.exists()) localIconsDir.mkdirs()

    File iconeDir = new File(localIconsDir, "${appNome}.png")
    if (iconePNG.exists()) {
        java.nio.file.Files.copy(
            iconePNG.toPath(), 
            iconeDir.toPath(), 
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
    // Acessa a pasta oculta de aplicativos do usuário
    File localAppsDir = new File(System.getProperty('user.home'), '.local/share/applications')
    if (!localAppsDir.exists()) { localAppsDir.mkdirs() } // cria a pasta se não existir
    
    new File(localAppsDir, "${appNome}.desktop").text = """
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=${appNome}
        Exec=\"${caminhoExe}\"
        Icon=${appNome}
        Terminal=false
        StartupWMClass=${appNome}
        Categories=Utility;Development;
        """.stripIndent().trim()
    
    try {
        // Força o GNOME/Wayland a ler a pasta e atualizar os ícones na hora
        ([ 
            'update-desktop-database', localAppsDir.absolutePath
        ]).execute().waitForProcessOutput(System.out, System.err)

        ([ 'gtk-update-icon-cache', '-f', '-t', 
            (new File(System.getProperty('user.home'), '.local/share/icons/hicolor')).absolutePath
        ]).execute().waitForProcessOutput(System.out, System.err)
    } catch(Exception e) {
        println '>> AVISO: update-desktop-database não rodou, mas o arquivo foi criado.'
    }
}
// Coleta as flamas de compilação
Closure<List<String>> pegaFlamasComp = { String alvo, String arqtt, String config, Boolean eRemot ->
    List<String> extras = []
    if (alvo.toLowerCase() == 'linux') { extras << '-I/usr/include/jsoncpp' }
    if (alvo.toLowerCase() == 'windows') { extras.addAll(['-DUNICODE', '-D_UNICODE']) }
    // Diferencia Caminhos Locais Absolutos dos Caminhos SSH Relativos
    return AuxiliarCppRecursosExternos.pegaFlamasComp(
        projDirProv.get().asFile,
        genDirProv.get().asFile,
        alvo, arqtt, config, eRemot, eWindowsProv.get(),
        cppStdProv.get(),
        config == 'Release' ? cppEntregaOProv.get() : null,
        extras
    )
}
// Coleta as flamas de Linkagem
Closure<List<String>> pegaFlamasLink = { String alvo, String arqtt, String config, Boolean eTeste ->
    String osAlvo = alvo.toLowerCase()
    List<String> flamasEstaticas = []
    List<String> flamasDinamicas = []
    List<String> flamasExtras = []

    if (alvo.toLowerCase() == 'windows') {
        flamasEstaticas = [
            '-lwinpthread', // Mata o erro do clock_gettime32
            // A Biblioteca Principal
            '-lcurl',
            '-ljsoncpp',
            // Protocolos de rede
            '-lnghttp2', // HTTP/2
            '-lnghttp3', // HTTP/3
            '-lngtcp2_crypto_ossl', // criptografia para QUIC/HTTP3
            '-lngtcp2', // QUIC/HTTP3
            '-lssh2', // para SFTP/SSH
            // Resolução de domínios e texto
            '-lpsl', // public Suffix List
            '-lidn2',
            '-lunistring',
            '-liconv',
            // Compressores
            '-lzstd',
            '-lbrotlidec',
            '-lbrotlicommon',
            // Criptografia Base
            '-lssl',
            '-lcrypto', // criptografia base
            '-lz' // compressão (frequentemente exigido pelo ssh2/ssl)
        ]
        flamasDinamicas = [
            // GUI do Windows
            '-lgdi32', 
            '-luser32', 
            '-luxtheme', 
            '-loleaut32', 
            '-lcomctl32', 
            '-lmsimg32',
            '-ldwmapi',
            // Sistema, Rede e Criptografia nativa
            '-ladvapi32',
            '-lws2_32', // Winsock2 (Rede)
            '-lcrypt32', // criptografia/Certificados (Schannel)
            '-lwldap32', // resolve os erros __imp_ldap_
            '-liphlpapi', // resolve o erro `if_nametoindex`
            '-lbcrypt', // geralmente exigido pelo OpenSSL no Windows
            '-lsecur32', // resolve o erro InitSecurityInterfaceA
            '-lavif' // compreende o formato avif
        ]
        
        if (eTeste) { flamasDinamicas.addAll(['-lgtest', '-lgtest_main', '-lpthread']) }

        flamasExtras << '-municode' // instrui a procurar por wWinMain
        // Insere do ícone do Windows
        if (!eTeste) {
            if (eWindowsProv.get()) {
                File icoObj = new File(
                    buildDirProv.get().asFile, (arqtt == 'X86' ? 'icone32.o' : 'icone64.o')
                )

                if (icoObj.exists()) {
                    flamasExtras << icoObj.absolutePath.replace(File.separator, '/')
                }
            } else {
                flamasExtras << (arqtt == 'X86' ? 'build/icons/icone32.o' : 'build/icons/icone64.o')
            }
            // Esconde o console se for Release e não for Teste
            if (config == 'Release') { flamasExtras << '-mwindows' }
        }
    } else if (alvo.toLowerCase() == 'linux') {
        if (eTeste) { flamasDinamicas.addAll(['-lgtest', '-lgtest_main']) }

        flamasDinamicas.addAll([
            '-lwayland-client', 
            '-lwayland-cursor', 
            '-lxkbcommon', 
            '-lfontconfig',
            '-lcurl', 
            '-lavif', 
            '-ljsoncpp'
        ])
    }
    
    return AuxiliarCppRecursosExternos.pegaFlamasLink(
        alvo, arqtt, config, flamasEstaticas, flamasDinamicas, flamasExtras
    )
}
// Envia os arquivos para a máquina virtual Linux
tasks.register('syncToLinux') {
    group = 'Desktop Actions'
    description = 'Sincroniza os arquivos fonte para a VM Linux via SSH'
    onlyIf { eWindowsProv.get() }
    // Regras de inputs
    mustRunAfter tasks.named('criaAsseios') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaAsseios'))
    inputs.dir srcDirProv
    inputs.dir asseiosDirProv
    outputs.upToDateWhen { true } // executa só 1 vez
    
    doFirst {
        // Prepara as pastas no Linux, adiciona o tmp e icones explicitamente
        comandoRemoto('linux', 
            ['mkdir', '-p', "${linDirProv.get()}/build/tmp", "${linDirProv.get()}/build/icons"]
        ).execute().waitForProcessOutput(System.out, System.err)
    }
    
    doLast {
        String sshAcesso = "${linDonoProv.get()}@${linSedeProv.get()}"
        String base = linDirProv.get()
        Directory projDir = projDirProv.get()
        
        println '>> INFO: [Linux] Enviando arquivos fonte e recursos...'
        Process processoSCP = (['scp', '-r', '-p', 
            projDir.dir('src').asFile.absolutePath.replace(File.separator, '/'), 
            asseiosDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshAcesso}:${base}/"
        ]).execute(null, projDir.asFile)
        processoSCP.waitForProcessOutput(System.out, System.err)
        if (processoSCP.exitValue() != 0) throw new GradleException('Falha no upload dos fontes!')
        
        println '>> INFO: [Linux] Enviando header gerado...'
        Process scpGen = (['scp', '-r', '-p', 
            genDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshAcesso}:${base}/build/tmp/"
        ]).execute(null, projDir.asFile)
        scpGen.waitForProcessOutput(System.out, System.err)
        if (scpGen.exitValue() != 0) throw new GradleException('Falha no upload do asseios.hpp!')

        println '>> INFO: [Linux] Enviando ícone...'
        File iconePNG = new File(buildDirProv.get().asFile, 'app_linux.png')
        if (iconePNG.exists()) {
            Process scpIco = (['scp', '-p', 
                iconePNG.absolutePath.replace(File.separator, '/'), 
                "${sshAcesso}:${base}/build/icons/"
            ]).execute(null, projDir.asFile)
            scpIco.waitForProcessOutput(System.out, System.err)
        }
        
        println '>> INFO: Sincronização para Linux concluída!'
    }
}
// Envia os arquivos para a máquina virtual Windows
tasks.register('syncToWindows') {
    group = 'Desktop Actions'
    description = 'Sincroniza os arquivos fonte para a VM Windows via SSH'
    onlyIf { eLinuxProv.get() }
    mustRunAfter tasks.named('criaAsseios') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaAsseios'))
    inputs.dir srcDirProv
    inputs.dir asseiosDirProv
    outputs.upToDateWhen { true } // executa só 1 vez
    
    doFirst {
        // Prepara as pastas no windows
        comandoRemoto('windows', 
            ['mkdir', '-p', winDirProv.get().replace(File.separator, '/')]
        ).execute().waitForProcessOutput(System.out, System.err)
    }
    
    doLast {
        String sshAcesso = "${winDonoProv.get()}@${winSedeProv.get()}"
        String base = winDirProv.get()
        Directory projDir = projDirProv.get()
        
        println '>> INFO: [Windows] Enviando arquivos fonte e recursos...'
        Process processoSCP = (['scp', '-r', '-p', 
            projDir.dir('src').asFile.absolutePath.replace(File.separator, '/'), 
            asseiosDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshAcesso}:${base}/"
        ]).execute(null, projDir.asFile)
        processoSCP.waitForProcessOutput(System.out, System.err)
        if (processoSCP.exitValue() != 0) throw new GradleException('Falha no upload dos fontes!')
        
        println '>> INFO: [Windows] Enviando header gerado...'
        Process scpGen = (['scp', '-r', '-p', 
            genDirProv.get().asFile.absolutePath.replace(File.separator, '/'), 
            "${sshAcesso}:${base}/build/tmp/"
        ]).execute(null, projDir.asFile)
        scpGen.waitForProcessOutput(System.out, System.err)
        if (scpGen.exitValue() != 0) throw new GradleException('Falha no upload do asseios.hpp!')
        
        println '>> INFO: [Windows] Enviando ícones e RC...'
        File obj32Arq = new File(buildDirProv.get().asFile, 'icone32.o')
        File obj64Arq = new File(buildDirProv.get().asFile, 'icone64.o')
        if (obj32Arq.exists() && obj64Arq.exists()) {
            Process scpIco = (['scp', '-p', 
                obj32Arq.absolutePath.replace(File.separator, '/'), 
                obj64Arq.absolutePath.replace(File.separator, '/'), 
                "${sshAcesso}:${base}/build/icons/"
            ]).execute(null, projDir.asFile)
            scpIco.waitForProcessOutput(System.out, System.err)
        }

        println '>> INFO: Sincronização para Windows concluída!'
    }
}
// Limpa o ambiente para melhores resultados
tasks.register('cleanDesktop') {
    group = 'Desktop Actions'
    description = 'Limpa os diretórios de build C++ localmente e nas VMs (via SSH)'

    doLast {
        File dirLocal = buildDirProv.get().asFile
        if (dirLocal.exists()) {
            println '>> INFO: [Local] Limpando diretório de build C++...'
            dirLocal.deleteDir()
        }
        // Limpeza Remota na VM Linux
        if (eWindowsProv.get()) {
            try {
                println '>> INFO: [Linux] Limpando diretório remoto via SSH...'
                // Manda um rm -rf na pasta build da VM Linux
                comandoRemoto(
                    'linux', ["rm -rf '${linDirProv.get()}/build'"]
                ).execute().waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Linux. Ela pode estar desligada.' 
            }
        }
        // Limpeza Remota na VM Windows
        if (eLinuxProv.get()) {
            try {
                println '>> INFO: [Windows] Limpando diretório remoto via SSH...'
                // Manda um rmdir (cmd) na pasta build da VM Windows
                comandoRemoto(
                    'windows', ["rmdir /s /q \"${winDirProv.get()}/build\""]
                ).execute().waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Windows. Ela pode estar desligada.' 
            }
        }
    }
}
