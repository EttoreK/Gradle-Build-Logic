// Closure centralização de execução
Closure<Void> crun = { Task tarefa, String alvo, String arqtt, String config ->
    String appDir = "main/${config}/${alvo}/${arqtt}/lib".toLowerCase()
    String buildNome = "build${alvo == 'Windows' ? 'Win' : 'Lin'}${arqtt == 'X86' ? '32' : '64'}"
    String tarefaBuildNome = "${buildNome}${config == 'Release' ? 'Release' : ''}"

    tarefa.group = 'Desktop Actions'
    tarefa.description = "Executa o binário ${alvo}-${arqtt}"
    tarefa.mustRunAfter(tasks.named(tarefaBuildNome))
    tarefa.inputs.files(tasks.named(tarefaBuildNome))
    tarefa.inputs.files(pegaArquivos(appDir))
    tarefa.outputs.upToDateWhen { false } // sempre executa

    tarefa.doFirst {
        String appNome = appNomeProv.get()
        String osAlvo = alvo.toLowerCase()
        String nomeExe = alvo == 'Windows' ? "${appNome}.exe" : appNome
        
        List<String> cmds
        if (eWindowsProv.get() && osAlvo == 'windows') {
            File exeDir = new File(instllDirProv.get().asFile, appDir)
            cmds = ["cd /d \"${exeDir.absolutePath}\"", '&&', 'start', '""', nomeExe]
        } else {
            String appDirRemoto = "build/install/${appDir}"
            if (osAlvo == 'windows') { 
                cmds = ["cd \"${appDirRemoto.replace('/', '\\')}\"", '&&', 'start', '""', nomeExe] 
            } else { 
                if (config == 'Debug') {
                    // No Debug, executa em primeiro plano e exibe os erros no console do Gradle
                    cmds = [
                        'export XDG_RUNTIME_DIR=/run/user/$(id -u)', '&&', 
                        'export WAYLAND_DISPLAY=$(ls /run/user/$(id -u)/wayland-* 2>/dev/null | head -n 1 | xargs basename 2>/dev/null || echo wayland-0)', '&&',
                        'export DISPLAY=:0', '&&', 
                        "cd '${appDirRemoto}'", '&&', 
                        "./${nomeExe}"
                    ]
                } else {
                    cmds = [
                        'export XDG_RUNTIME_DIR=/run/user/$(id -u)', '&&',
                        'export WAYLAND_DISPLAY=$(ls /run/user/$(id -u)/wayland-* 2>/dev/null | head -n 1 | xargs basename 2>/dev/null || echo wayland-0)', '&&',
                        'export DISPLAY=:0', '&&',
                        "cd '${appDirRemoto}'", '&&',
                        "nohup ./${nomeExe} >/dev/null 2>&1 </dev/null &"
                    ]
                }
            }
        }
        // Ícone do desktop só faz sentido se estiver rodando localmente no Linux
        if (osAlvo == 'linux' && eLinuxProv.get()) { 
            desktop(
                appNome, new File(instllDirProv.get().asFile, "${appDir}/${nomeExe}").absolutePath
            )
        }

        println ">> INFO: Executando ${alvo}..."
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process processoExecutar = comandoRemoto(osAlvo, cmds, dirDireto).execute()
        if (osAlvo == 'linux') {
            processoExecutar.waitForProcessOutput(System.out, System.err)
        } else {
            processoExecutar.waitFor() // tem que ser waitFor() e não waitForProcessOutput()
        }

        if (processoExecutar.exitValue() != 0) {
            throw new GradleException("A execução falhou (exit ${processoExecutar.exitValue()}).")
        }
    }
}
