// Se necessário encapsula o comando em uma chamada ssh para a VM
Closure<List<String>> comandoRemoto = { String os, List<String> entradaCmds, String extDir = null ->
    boolean alvoLin = (os == 'linux')
    return AuxiliarCppRecursosExternos.comandoRemoto(
        eWindowsProv.get(), eLinuxProv.get(), os, entradaCmds, projDirProv.get().asFile,
        alvoLin ? linDonoProv.orNull : winDonoProv.orNull,
        alvoLin ? linSedeProv.orNull : winSedeProv.orNull,
        alvoLin ? linDirProv.orNull : winDirProv.orNull,
        extDir
    )
}
// Retorna arquivos para os artefatos de build
