// Se necessário encapsula o comando em uma chamada ssh para a VM
Closure<List<String>> comandoRemoto = { String os, List<String> cmdEntrada, String extDir = null ->
    if (eWindowsProv.get() && os == 'linux') {
        if (!lnxDonoProv.isPresent() || !lnxSedeProv.isPresent() || !lnxDirProv.isPresent()){
            throw new GradleException('Credenciais não configuradas pra Linux')
        }
        return [ // Cria a pasta base antes de dar o cd
            'ssh', "${lnxDonoProv.get()}@${lnxSedeProv.get()}", 
            "mkdir -p '${lnxDirProv.get()}' && cd '${lnxDirProv.get()}' && ${cmdEntrada.join(' ')}"
        ]
    } else if (eLinuxProv.get() && os == 'windows') {
        if (!winDonoProv.isPresent() || !winSedeProv.isPresent() || !winDirProv.isPresent()){
            throw new GradleException('Credenciais não configuradas pra Windows')
        }
        return [ // Cria a pasta antes de dar o cd no Windows
            'ssh', "${winDonoProv.get()}@${winSedeProv.get()}", 
            "if not exist \"${winDirProv.get()}\" mkdir \"${winDirProv.get()}\" &",
            "cd /d \"${winDirProv.get()}\" && ${cmdEntrada.join(' ')}"
        ]
    } else {
        String dirLocal = projDirProv.get().asFile.absolutePath
        if (eWindowsProv.get()) {
            // Se foi passado um caminho extra, injeta ele no início do PATH do Windows
            if (extDir != null) {
                return [
                    'cmd', '/c', "set \"PATH=${extDir};%PATH%\" &&" +
                    "cd /d \"${dirLocal}\" && ${cmdEntrada.join(' ')}"
                ]
            } else {
                return ['cmd', '/c', "cd /d \"${dirLocal}\" && ${cmdEntrada.join(' ')}"]
            }
        } else {
            return ['bash', '-c', "cd '${dirLocal}' && ${cmdEntrada.join(' ')}"]
        }
    }
}
