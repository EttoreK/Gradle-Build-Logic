// Copiar recursos para a saída
Closure<Void> copiaRes = { File dirDestino ->
    File espolioPasta = espolioDirProv.get().asFile
    if (!espolioPasta.exists()) {
        println ">> AVISO: Pasta ${espNomeProv.get()} não encontrada em: ${espolioPasta}"
        return
    }

    File recursosDest = new File(dirDestino, 'recursos')
    if (!recursosDest.exists()) recursosDest.mkdirs()
    
    println ">> INFO: Copiando recursos de '${espolioPasta.name}' para '${recursosDest.name}'..."
    // Caminha recursivamente por todos os arquivos do espolio
    espolioPasta.eachFileRecurse { File origem ->
        // Calcula o caminho relativo
        java.nio.file.Path rastro = espolioPasta.toPath().relativize(origem.toPath())
        File destino = new File(recursosDest, rastro.toString())

        if (origem.isDirectory()) {
            destino.mkdirs()
        } else {
            destino.parentFile.mkdirs()
            // Copia substituindo se existir
            java.nio.file.Files.copy(
                origem.toPath(), 
                destino.toPath(), 
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
// Converte arquivos de espolio para hpp
Closure<Void> embuteRes = { ->
    File espolioArq = espolioDirProv.get().asFile
    File saidaHpp = new File(genDirProv.get().asFile, "${espNomeProv.get()}.hpp")

    if (!espolioArq.exists()) return
    saidaHpp.parentFile.mkdirs()

    List<String> mapa = []
    StringBuilder hpp = new StringBuilder()

    hpp.append('#pragma once\n')
    hpp.append('#include <string>\n')
    hpp.append('#include <vector>\n')
    hpp.append('#include <map>\n\n')
    hpp.append("namespace ${espNomeProv.get()} {\n")

    espolioArq.eachFileRecurse { File arq ->
        if (arq.isFile()) {
            String dir = espolioArq.toPath().relativize(
                arq.toPath()).toString().replace(File.separator, '/')
            String nome = dir.replaceAll('[^a-zA-Z0-9]', '_')
            byte[] bytes = arq.readBytes()
            
            hpp.append("    const unsigned char ${nome}[] = {")
            hpp.append(bytes.collect { String.format('0x%02x', it) }.join(', '))
            hpp.append('};\n')
            
            mapa.add("\t\t{\"${dir}\", std::vector<uint8_t>(${nome}, ${nome} + sizeof(${nome}))}")
        }
    }

    hpp.append('\n\tinline std::vector<uint8_t> Obter(const std::string& caminho) {\n')
    hpp.append('\t\tstatic std::map<std::string, std::vector<uint8_t>> arquivos = {\n')
    hpp.append(mapa.join(',\n'))
    hpp.append('\n\t\t};\n')
    hpp.append('\t\tif (arquivos.count(caminho)) return arquivos[caminho];\n')
    hpp.append('\t\treturn {};\n')
    hpp.append('\t}\n')
    hpp.append('}\n')

    String arquivo = hpp.toString()
    // Só salva no disco se o conteúdo realmente mudou
    if (!saidaHpp.exists() || saidaHpp.text != arquivo) {
        saidaHpp.text = arquivo
    }
}
// Configura o ícone do aplicativo
Closure<Void> desktop = { String appNome, String caminhoExe ->
    File pngIcon = new File(buildDirProv.get().asFile, 'app_linux.png')

    File localIconsDir = new File(
        System.getProperty('user.home'), '.local/share/icons/hicolor/512x512/apps')
    if (!localIconsDir.exists()) localIconsDir.mkdirs()

    File iconDestino = new File(localIconsDir, "${appNome}.png")
    if (pngIcon.exists()) {
        java.nio.file.Files.copy(
            pngIcon.toPath(), 
            iconDestino.toPath(), 
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
    // Acessa a pasta oculta de aplicativos do usuário
    File localAppsDir = new File(System.getProperty('user.home'), '.local/share/applications')
    if (!localAppsDir.exists()) localAppsDir.mkdirs() // cria a pasta se não existir
    
    File desktopFile = new File(localAppsDir, "${appNome}.desktop")
    desktopFile.text = """
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=${appNome}
        Exec="${caminhoExe}"
        Icon=${appNome}
        Terminal=false
        StartupWMClass=Logger
        Categories=Utility;Development;
        """.stripIndent().trim()
    
    try {
        // Força o GNOME/Wayland a ler a pasta e atualizar os ícones na hora
        Process pUpd = ['update-desktop-database', localAppsDir.absolutePath].execute()
        pUpd.waitForProcessOutput(System.out, System.err)

        File baseIconDir = new File(System.getProperty('user.home'), '.local/share/icons/hicolor')
        Process pIcon = ['gtk-update-icon-cache', '-f', '-t', baseIconDir.absolutePath].execute()
        pIcon.waitForProcessOutput(System.out, System.err)
    } catch(Exception e) {
        println '>> AVISO: update-desktop-database não rodou, mas o arquivo foi criado.'
    }
}
// Coleta as flags de compilação
Closure<List<String>> pegaFlagsComp = { String alvo, String arqtt, String config, Boolean eRemoto ->
    List<String> flags = ['-std=c++26', '-Os']
    
    if (alvo.toLowerCase() == 'linux') flags << '-I/usr/include/jsoncpp'
    
    flags << (arqtt == 'X86' ? '-m32' : '-m64')
    // Diferencia Caminhos Locais Absolutos dos Caminhos SSH Relativos
    if (eRemoto) {
        String reDir = genDirProv.get().asFile.absolutePath.replace(File.separator, '/')
        flags << '-Isrc/main/headers'
        flags << '-Isrc/main/bib/svg'
        if (eWindowsProv.get() && alvo.toLowerCase() == 'windows') {
            flags << "-I${reDir}".toString()
        } else {
            flags << '-Ibuild/tmp/generated'
        }
    } else {
        flags << "-I${projDirProv.get().asFile.absolutePath}/src/main/bib/svg"
        flags << "-I${genDirProv.get().asFile.absolutePath.replace(File.separator, '/')}".toString()
    }
    return flags
}
// Coleta as flags de Linkagem
Closure<List<String>> pegaFlagsLink = { String alvo, String arqtt, String config, Boolean eTeste ->
    List<String> flags = []
    if (config == 'Release') flags.addAll(['-s'])

    if (alvo.toLowerCase() == 'windows') {
        flags << '-static'
        flags << '-Wl,--start-group'
        flags.addAll(['-lgdi32', '-luser32', '-luxtheme', '-loleaut32', '-lcomctl32', '-ljsoncpp'])
        
        if (eTeste) flags.addAll(['-lgtest', '-lgtest_main', '-lpthread'])
        
        flags << '-Wl,--end-group'
        flags.addAll(['-static-libgcc', '-static-libstdc++'])
        // Esconde o console se for Release e não for Teste
        if (config == 'Release' && !eTeste) {
            flags << '-mwindows'
        }
    } 
    else if (alvo.toLowerCase() == 'linux') {
        if (arqtt == 'X86') {
            flags.addAll([
                '-m32', 
                '-Wl,-m,elf_i386', 
                '-L/usr/lib/i386-linux-gnu', 
                '/usr/lib/i386-linux-gnu/libjsoncpp.a'
            ])
        } else {
            flags.addAll([
                '-m64', 
                '-Wl,-m,elf_x86_64', 
                '-L/usr/local/lib', 
                '-L/usr/lib/x86_64-linux-gnu'
            ])
        }
        flags.addAll(['-Wl,-Bstatic', '-ljsoncpp'])
        
        if (eTeste) flags.addAll(['-lgtest', '-lgtest_main'])
        
        flags.addAll(['-Wl,-Bdynamic', '-lX11', '-pthread', '-static-libgcc', '-static-libstdc++'])
    }
    return flags
}
// Envia os arquivos para a máquina virtual Linux
tasks.register('syncToLinux') {
    group = 'C++ Actions'
    description = 'Sincroniza os arquivos fonte para a VM Linux via SSH'
    onlyIf { eWindowsProv.get() }
    // Regras de inputs
    mustRunAfter tasks.named('criaEspolio') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaEspolio'))
    inputs.dir project.file('src')
    inputs.dir espolioDirProv
    outputs.upToDateWhen { true } // executa só 1 vez
    
    doFirst {
        // Prepara as pastas no Linux, adiciona o tmp e icones explicitamente
        Process procMkdir = comandoRemoto( 'linux', 
            ['mkdir', '-p', "${lnxDirProv.get()}/build/tmp", "${lnxDirProv.get()}/build/icons"]
        ).execute()
        procMkdir.waitForProcessOutput(System.out, System.err)
    }
    
    doLast {
        String sshLogin = "${lnxDonoProv.get()}@${lnxSedeProv.get()}"
        String base = lnxDirProv.get()
        
        println '>> INFO: [Linux] Enviando arquivos fonte e recursos...'
        Directory projDir = projDirProv.get()
        String srcDir = projDir.dir('src').asFile.absolutePath.replace(File.separator, '/')
        String espDir = espolioDirProv.get().asFile.absolutePath.replace(File.separator, '/')
        
        Process procScpFonte = (
            ['scp', '-r', '-p', srcDir, espDir, "${sshLogin}:${base}/"]
        ).execute(null, projDir.asFile)
        procScpFonte.waitForProcessOutput(System.out, System.err)
        if (procScpFonte.exitValue() != 0) throw new GradleException('Falha no upload dos fontes!')
        
        println '>> INFO: [Linux] Enviando header gerado...'
        Process procScpH = ([
            'scp', '-r', '-p', 
            genDirProv.get().asFile.absolutePath, "${sshLogin}:${base}/build/tmp/"
        ]).execute(null, projDir.asFile)
        procScpH.waitForProcessOutput(System.out, System.err)
        
        println '>> INFO: [Linux] Enviando ícone...'
        File pngIcon = new File(buildDirProv.get().asFile, 'app_linux.png')
        if (pngIcon.exists()) {
            Process procScpIcone = (
                ['scp', '-p', pngIcon.absolutePath, "${sshLogin}:${base}/build/icons/"]
            ).execute(null, projDir.asFile)
            procScpIcone.waitForProcessOutput(System.out, System.err)
        }
        
        println '>> INFO: Sincronização para Linux concluída!'
    }
}
// Envia os arquivos para a máquina virtual Windows
tasks.register('syncToWindows') {
    group = 'C++ Actions'
    description = 'Sincroniza os arquivos fonte para a VM Windows via SSH'
    onlyIf { eLinuxProv.get() }
    mustRunAfter tasks.named('criaEspolio') // roda a closure geradora antes de compilar
    inputs.files(tasks.named('criaEspolio'))
    inputs.dir project.file('src')
    inputs.dir espolioDirProv
    outputs.upToDateWhen { true } // executa só 1 vez
    
    doFirst {
        // Prepara as pastas no windows
        Process procMkdir = comandoRemoto(
            'windows', ['mkdir', '-p', winDirProv.get().replace(File.separator, '/')]
        ).execute()
        procMkdir.waitForProcessOutput(System.out, System.err)
    }
    
    doLast {
        String sshLogin = "${winDonoProv.get()}@${winSedeProv.get()}"
        String base = winDirProv.get()
        
        println '>> INFO: [Windows] Enviando arquivos fonte e recursos...'
        Directory projDir = projDirProv.get()
        String srcDir = projDir.dir('src').asFile.absolutePath.replace(File.separator, '/')
        String espDir = espolioDirProv.get().asFile.absolutePath.replace(File.separator, '/')
        
        Process procScpFonte = (
            ['scp', '-r', '-p', srcDir, espDir, "${sshLogin}:${base}/"]
        ).execute(null, projDir.asFile)
        procScpFonte.waitForProcessOutput(System.out, System.err)
        if (procScpFonte.exitValue() != 0) throw new GradleException('Falha no upload dos fontes!')
        
        println ">> INFO: [Windows] Enviando header gerado..."
        Process procScpH = ([
            'scp', '-r', '-p', 
            genDirProv.get().asFile.absolutePath, "${sshLogin}:${base}/build/tmp/"
        ]).execute(null, projDir.asFile)
        procScpH.waitForProcessOutput(System.out, System.err)
        
        println '>> INFO: [Windows] Enviando ícones e RC...'
        File obj32 = new File(buildDirProv.get().asFile, 'icone32.o')
        File obj64 = new File(buildDirProv.get().asFile, 'icone64.o')
        if (obj32.exists() && obj64.exists()) {
            Process procScpIcone = ([
                'scp', '-p', obj32.absolutePath, obj64.absolutePath, 
                "${sshLogin}:${base}/build/icons/"
            ]).execute(null, projDir.asFile)
            procScpIcone.waitForProcessOutput(System.out, System.err)
        }

        println '>> INFO: Sincronização para Windows concluída!'
    }
}
// Limpa o ambiente para melhores resultados
tasks.register('cleanC') {
    group = 'C++ Actions'
    description = 'Limpa os diretórios de build C++ localmente e nas VMs (via SSH)'

    doLast {
        File dirLocal = buildDirProv.get().asFile
        if (dirLocal.exists()) {
            println '>> INFO: [Local] Limpando diretório de build C++...'
            dirLocal.deleteDir()
        }
        // Limpeza Remota na VM Linux
        if (eWindowsProv.get()) {
            try {
                println '>> INFO: [Linux] Limpando diretório remoto via SSH...'
                // Manda um rm -rf na pasta build da VM Linux
                Process pLnx = comandoRemoto(
                    'linux', ["rm -rf '${lnxDirProv.get()}/build'"]
                ).execute()
                pLnx.waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Linux. Ela pode estar desligada.' 
            }
        }
        // Limpeza Remota na VM Windows
        if (eLinuxProv.get()) {
            try {
                println '>> INFO: [Windows] Limpando diretório remoto via SSH...'
                // Manda um rmdir (cmd) na pasta build da VM Windows
                Process pWin = comandoRemoto(
                    'windows', ["rmdir /s /q \"${winDirProv.get()}\\build\""]
                ).execute()
                pWin.waitForProcessOutput(System.out, System.err)
            } catch(Exception e) { 
                println '>> AVISO: Não foi possível limpar a VM Windows. Ela pode estar desligada.' 
            }
        }
    }
}
