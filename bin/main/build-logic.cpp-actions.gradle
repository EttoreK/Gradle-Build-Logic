// Cria um objeto para o icone do aplicativo
Closure<Void> criaIcoWin = { File svgFundo, File svgFrente, File icoArq, File rcFile, 
    File objArq32, File objArq64 ->
    if (!svgFundo.exists()) throw new GradleException('Faltou o SVG de Fundo!')
    if (!svgFrente.exists()) throw new GradleException('Faltou o SVG de Frente!')
    
    File pastaBuild = icoArq.parentFile
    if (!pastaBuild.exists()) pastaBuild.mkdirs()
        
    String msysDir = winDiscProv.get()
    String magickCmd = eWindowsProv.get() ? "${msysDir}:/msys64/ucrt64/bin/magick.exe" : 'magick'

    List<String> mesclaSVG = [
        magickCmd,
        '-background', 'none',
        svgFundo.absolutePath, // carrega a imagem de trás
        svgFrente.absolutePath, // carrega a imagem da frente
        '-gravity', 'center', // centraliza o alinhamento
        '-composite', // mescla as duas imagens
        '-define', 'icon:auto-resize=256,128,64,48,32,16', 
        icoArq.absolutePath // salva o resultado
    ]
    Process prcessoMescla = mesclaSVG.execute()
    prcessoMescla.waitForProcessOutput(System.out, System.err)
    if (prcessoMescla.exitValue() != 0) {
        throw new GradleException('Falha ao mesclar')
    }

    rcFile.text = "id ICON \"${icoArq.absolutePath.replace(File.separator, '/')}\""

    Closure<Void> rodaWindres = { String cmd, File objArq, String extraDir ->
        ProcessBuilder pb = new ProcessBuilder(cmd, rcFile.absolutePath, '-o', objArq.absolutePath)
        
        if (eWindowsProv.get() && extraDir != null) {
            // Injeta a pasta bin exata no início do path do Windows
            String atualDir = pb.environment().get('PATH')
            pb.environment().put('PATH', extraDir + File.pathSeparator + atualDir)
        }
        
        Process p = pb.start()
        p.waitForProcessOutput(System.out, System.err)
        if (p.exitValue() != 0) {
            throw new GradleException("Falha no windres para ${objArq.name}")
        }
    }
    // Injeção isolada para 32 e 64 bits
    if (eWindowsProv.get()) {
        rodaWindres("${msysDir}:/msys64/mingw32/bin/windres.exe", 
            objArq32, "${msysDir}:\\msys64\\mingw32\\bin")
        rodaWindres("${msysDir}:/msys64/ucrt64/bin/windres.exe", 
            objArq64, "${msysDir}:\\msys64\\ucrt64\\bin")
    } else {
        rodaWindres('i686-w64-mingw32-windres', objArq32, null)
        rodaWindres('x86_64-w64-mingw32-windres', objArq64, null)
    }
}
