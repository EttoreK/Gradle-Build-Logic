// Closure centralização de execução
Closure<Void> crun = { Task tarefa, String alvo, String arqtt, String config ->
    String appDir = "${config}/${alvo}/${arqtt}/lib".toLowerCase()
    String tarefaNativaNome = "install${config}${alvo}${arqtt}"
    String buildNome = "build${alvo == "Windows" ? "Win" : "Lnx"}${arqtt == "X86" ? "32" : "64"}"

    tarefa.group = 'C++ Actions'
    tarefa.description = "Executa o binário ${alvo}-${arqtt}"
    tarefa.inputs.files(tasks.named("${buildNome}${config == "Release" ? 'Release' : ''}"))
    tarefa.inputs.files(pegaArquivos(appDir))
    if (tasks.findByName(tarefaNativaNome)) {
        tarefa.inputs.files(tasks.named(tarefaNativaNome))
        tarefa.mustRunAfter tasks.named(tarefaNativaNome)
    }
    tarefa.outputs.upToDateWhen { false } // sempre executa

    tarefa.doFirst {
        String appNome = appNomeProv.get()
        String osAlvo = alvo.toLowerCase()
        String nomeExe = alvo == 'Windows' ? "${appNome}.exe" : appNome
        File rootDir = projDirProv.get().asFile.parentFile
        
        List<String> cmdsTerminal
        if (osAlvo == 'windows') {
            if (eWindowsProv.get()) {
                String absoluteDir = new File(rootDir, "build/install/main/${appDir}").absolutePath
                cmdsTerminal = ["cd /d \"${absoluteDir}\"", '&&', 'start', '""', nomeExe]
            } else {
                String dirRemoto = "build/install/main/${appDir}"
                cmdsTerminal = [
                    "cd \"${dirRemoto.replace(File.separator, '\\')}\"", 
                    '&&', 'start', '\"\"', nomeExe
                ]
            }
        } else {
            String dirRemoto = "build/install/main/${appDir}"
            String envSetup = String.join(' ',
                'export DISPLAY=:0', '&&',
                'export XAUTHORITY=$(ls',
                '/run/user/$(id -u)/gdm/Xauthority',
                '/run/user/$(id -u)/.mutter-Xwaylandauth*',
                '/run/user/$(id -u)/Xauthority',
                '~/.Xauthority 2>/dev/null | head -n 1)'
            )
            cmdsTerminal = [
                envSetup, '&&', 
                "cd '${dirRemoto}'", '&&', 
                "setsid sh -c 'exec ./${nomeExe} > /dev/null 2>&1 < /dev/null &' > /dev/null 2>&1"
            ]
        }
        // Ícone do desktop só faz sentido se estiver rodando localmente no Linux
        if (osAlvo == 'linux' && eLinuxProv.get()) {
            desktop(
                appNome, new File(installDirProv.get().dir(appDir).asFile, nomeExe).absolutePath)
        }

        println ">> INFO: Executando ${alvo}..."
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process procRun = comandoRemoto(osAlvo, cmdsTerminal, dirDireto).execute()
        procRun.waitForProcessOutput(System.out, System.err)
        if (procRun.exitValue() != 0) {
            throw new GradleException('A execução falhou.')
        }
    }
}
