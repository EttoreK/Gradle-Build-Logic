// Centralização de teste
Closure<Void> ctest = { Task tarefa, String alvo, String arqtt, String config ->
    String testDir = "${alvo}/${arqtt}/lib".toLowerCase()
    String tarefaNativaNome = "installTest${alvo}${arqtt}"
    String buildNome = "build${alvo == 'Windows' ? 'Win' : 'Lnx'}${arqtt == 'X86' ? '32' : '64'}"

    tarefa.group = 'C++ Actions' // grupo padrão para testes
    tarefa.description = "Executa os testes unitários em ${alvo}-${arqtt}"
    tarefa.inputs.files(tasks.named("${buildNome}${config == 'Release' ? 'Release' : ''}"))
    if (tasks.findByName(tarefaNativaNome)) {
        tarefa.inputs.files(tasks.named(tarefaNativaNome))
        tarefa.mustRunAfter tasks.named(tarefaNativaNome)
    }
    tarefa.outputs.upToDateWhen { false } // testes devem sempre rodar

    tarefa.doFirst {
        String appTestNome = "${appNomeProv.get()}Test" 
        String osAlvo = alvo.toLowerCase()
        String nomeExe = alvo == 'Windows' ? "${appTestNome}.exe" : appTestNome        
        // Cópia local de recursos antes do teste
        File exeDir = installTestDirProv.get().dir(testDir).asFile
        copiaRes(exeDir)

        if (osAlvo == 'linux') {
            println ">> INFO: Compilando Testes [${alvo}-${arqtt}] nativamente na VM..."
            String dirRemoto = "build/install/test/${testDir}"
            List<String> cmdGppTest = ['g++']
            cmdGppTest.addAll(pegaFlagsComp(alvo, arqtt, config, true))
            cmdGppTest << "\$(find src/main/cpp -name '*.cpp' ! -name 'app.cpp')"
            cmdGppTest << "\$(find src/test/cpp -name '*.cpp')"
            cmdGppTest << '-o' << "'${dirRemoto}/${nomeExe}'"
            cmdGppTest.addAll(pegaFlagsLink(alvo, arqtt, config, true))

            Process pComp = comandoRemoto(osAlvo, [
                "mkdir -p '${dirRemoto}'", '&&',
                cmdGppTest.join(' ')
            ]).execute()
            pComp.waitForProcessOutput(System.out, System.err)

            if (pComp.exitValue() != 0) {
                throw new GradleException('Falha ao compilar testes no Linux')
            }
        }
        
        List<String> cmdsTerminal
        if (osAlvo == 'windows') {
            if (eWindowsProv.get()) {
                // Usa o diretório absoluto local do exeDir
                String absoluteDir = exeDir.absolutePath
                cmdsTerminal = ["cd /d \"${absoluteDir}\"", '&&', nomeExe]
            } else {
                String dirRemoto = "build/install/test/${testDir}"
                cmdsTerminal = ["cd \"${dirRemoto.replace(File.separator, '\\')}\"", '&&', nomeExe]
            }
        } else {
            String dirRemoto = "build/install/test/${testDir}"
            String envSetup = String.join(' ',
                'export DISPLAY=:0', '&&',
                'export XAUTHORITY=$(ls',
                '/run/user/$(id -u)/gdm/Xauthority',
                '/run/user/$(id -u)/.mutter-Xwaylandauth*',
                '/run/user/$(id -u)/Xauthority',
                '~/.Xauthority 2>/dev/null | head -n 1)'
            )
            cmdsTerminal = [envSetup, '&&', "cd '${dirRemoto}'", '&&', "./${nomeExe}"]
        }

        println ">> INFO: Executando testes unitários em ${alvo}..."
        String dirDireto = null
        if (eWindowsProv.get() && osAlvo == 'windows') {
            dirDireto = "${winDiscProv.get()}:/msys64/${arqtt == 'X86' ? 'mingw32' : 'ucrt64'}/bin"
        }
        Process procTest = comandoRemoto(osAlvo, cmdsTerminal, dirDireto).execute()
        procTest.waitForProcessOutput(System.out, System.err) // no teste, espera o GTest acabar
        
        if (procTest.exitValue() != 0) {
            throw new GradleException('Os testes unitários do C++ falharam.')
        }
    }
}
