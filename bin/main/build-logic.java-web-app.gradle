// Provedores de propriedades
Provider<Map<String, String>> progPropsProv = providers.of(AuxiliarGeralLeitorDePropriedades) { 
    String nomeArq = providers.gradleProperty('progPropertiesNome').getOrElse('programa.properties')
    parameters.propertiesFile.set(layout.settingsDirectory.file(nomeArq))
}
// Define o diretório de build usando o nome dinâmico da pasta
layout.buildDirectory.set(layout.settingsDirectory.dir(
    progPropsProv.map { it.getOrDefault('buildDirJavaWeb', 'build/java/web') }
))
// Declaração dos plugins
// plugins {}
plugins.apply(libs.plugins.javaApp.get().getPluginId()) // plugin oficial para aplicações java
plugins.apply(libs.plugins.springBoot.get().getPluginId()) // plugin oficial do springboot
plugins.apply(libs.plugins.buildLogicJavaGeral.get().getPluginId())
plugins.apply(libs.plugins.buildLogicJavaWebActions.get().getPluginId())
// Exclusões padrão do Spring Boot
configurations {
    // Remove todas as dependências de uma vez
    all {
        exclude group: 'org.hibernate.validator', module: 'hibernate-validator'
        exclude group: 'org.yaml', module: 'snakeyaml'
        exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-websocket'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'tools.jackson.core'
        exclude group: 'org.springframework.boot', module: 'spring-boot-jarmode-tools'
        exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-el'
        exclude group: 'jakarta.xml.bind', module: 'jakarta.xml.bind-api'
        exclude group: 'org.glassfish.jaxb', module: 'jaxb-runtime'
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }
}
// Configuração das fontes de recursos, bibliotecas e arquivos
sourceSets {
    main {
        resources {
            srcDirs += ['src/main/resources'] // mantém os recursos padrões
            // inclui o conteúdo da pasta asseios no Classpath
            srcDirs += [layout.settingsDirectory.dir(
                progPropsProv.map { it.getOrDefault('asseiosDir', 'asseios') }
            )]
            // inclui o ícone gerado
            srcDirs += tasks.named('webIco').map {
                it.outputs.files.singleFile.parentFile.parentFile
            }
        }
    }
}
// Manipulação do arquivo .classpath para o VSCODE parar de reclamar
tasks.register('posBuildWeb') {
    group = 'Web Actions'
    description = 'Sobrescreve o .classpath do VS Code incluindo dependências do projeto Web'
    mustRunAfter tasks.named('classes') // roda logo após a compilação do Java
    // Pega as dependências de compilação do Java
    Provider<Set<FileSystemLocation>> compDepProv = configurations.named(
        'compileClasspath'
    ).flatMap { it.elements }
    Provider<RegularFile> classpathArqProv = objects.fileProperty().convention(
        layout.projectDirectory.file('.classpath')
    )

    inputs.files(compDepProv)
    inputs.file(classpathArqProv).optional()

    doLast {
        File classpathArq = classpathArqProv.get().asFile

        if (classpathArq.exists() && classpathArq.canWrite()) {
            String xmlOriginal = classpathArq.text
            StringBuilder novasBib = new StringBuilder()

            List<String> linhasLimpas = []
            xmlOriginal.eachLine { String linha ->
                if (linha.contains('kind="lib"')) {
                    java.util.regex.Matcher matcher = (linha =~ /path="([^"]+)"/)
                    if (matcher.find()) {
                        if (new File(matcher.group(1)).exists()) { linhasLimpas << linha }
                    } else { linhasLimpas << linha }
                } else { linhasLimpas << linha }
            }
            String xmlArq = linhasLimpas.join('\n')

            compDepProv.get().each { FileSystemLocation loc ->
                String caminho = loc.asFile.absolutePath.replace(File.separator, '/')
                if (caminho.endsWith('.jar') && !xmlArq.contains("path=\"${caminho}\"")) {
                    novasBib.append("    <classpathentry kind=\"lib\" path=\"${caminho}\"/>\n")
                }
            }

            if (novasBib.length() > 0 || xmlArq != xmlOriginal) {
                if (novasBib.length() > 0) {
                    xmlArq = xmlArq.replace('</classpath>', "${novasBib.toString()}</classpath>")
                }
                classpathArq.text = xmlArq
                println '>> INFO: .classpath de Java-Web atualizado.'
            }
        }
    }
}
// Ignora duplicatas em recursos e JARs
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// Dependências Spring Boot
